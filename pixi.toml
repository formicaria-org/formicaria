[workspace]
name = "formicaria"
version = "0.0.0"
description = "Local-first, single-user research notebook (fm). Full spec: formicaria/MASTERPLAN.md"
channels = ["conda-forge"]
# One platform floor, harmless and met by any 2021+ distro (Ubuntu 22.04 ships
# glibc 2.35). It cost nothing to keep after the webkit stack was removed.
platforms = [{ platform = "linux-64", glibc = "2.34" }, "osx-arm64", "osx-64", "win-64"]

# The umbrella layer: toolchain + version-locked native/subprocess tools.
# App-level deps live in Cargo.lock (Rust) and pnpm-lock.yaml (JS); pixi.lock
# pins THIS layer so a 2031 checkout resolves the same rustc and the same
# pdftotext. See MASTERPLAN "Dependency & environment management".
[dependencies]
rust = "*"
c-compiler = "*"     # cc for rusqlite's bundled SQLite (and any C build), pinned via conda-forge
nodejs = "*"
pnpm = "*"
poppler = "*"        # provides pdftotext (PDF text -> FTS5, the killer feature)
libvips = "*"        # provides vipsthumbnail (image/video thumbnails)
restic = "*"         # backup: dedup + encryption + integrity + bit-rot scrub
cargo-deny = "*"     # license / advisory gate
mdbook = "*"         # renders docs/ to a static site; built in CI

# v2 extractors, isolated so the default env stays lean.
[feature.media.dependencies]
ffmpeg = "*"
tesseract = "*"

# Android cross-compilation. **A feature and an environment, never a platform** — the plan's
# ruling: adding `linux-aarch64`-style android entries to `platforms` would claim we build and
# test there, which we do not. This only adds the Rust standard library for the two targets
# that matter (the phone, and the x86_64 emulator).
#
# These ARE conda-forge packages, so the Rust half of the Android toolchain is version-locked
# in `pixi.lock` like everything else. The gap is only the NDK and SDK, which have no conda
# packaging and are fetched into a gitignored `.android/` by `pixi run android-init`, pinned by
# SHA-256 in `android/toolchain.lock` (`docs/context/decisions.md`, ruling 3).
#
# Kept out of the default environment on purpose: a contributor with no interest in Android
# must not pay for these, and `pixi run ci` must stay green without them.
[feature.android.dependencies]
# All four Android ABIs: Tauri's `android init` installs every one, and a missing target
# fails the whole build rather than just that ABI. arm64 is the phone, x86_64 the emulator;
# the 32-bit pair is legacy but cheap and keeps `tauri android build` from breaking.
rust-std-aarch64-linux-android = "*"   # the phone
rust-std-x86_64-linux-android = "*"    # the emulator
rust-std-armv7-linux-androideabi = "*"
rust-std-i686-linux-android = "*"
# **Pinned to 21, not "*".** conda-forge's default is Java 25, whose class file version (69)
# Gradle 8.14 refuses outright — the build dies in "semantic analysis" with "Unsupported class
# file major version 69", which names neither Java nor Gradle. 21 is the current LTS and what
# the Android Gradle Plugin targets. Bump only with a Gradle that says it supports it.
openjdk = "21.*"

# Point cargo and the `cc` crate at the NDK, **repo-relative**. Deliberately here rather than
# in `.cargo/config.toml`: that file cannot express "relative to the project", so it would need
# absolute paths — unshareable between machines, and exactly the kind of thing that rots.
# `$PIXI_PROJECT_ROOT` keeps it portable and keeps the whole toolchain inside the checkout.
#
# minSdk 24 (Android 7.0) is the floor these wrappers encode. The NDK ships 21–35; 24 covers
# effectively every device in use and is the level to change if that stops being true.
#
# **The 16 KB alignment flag is load-bearing, not hygiene.** Google states 16 KB page size as a
# *device* property: without it, future Android releases will not run the app at all. r27 needs
# it explicitly; r28+ makes it the default, which is the reason to bump later.
[feature.android.activation.env]
# The SDK: sdkmanager, the emulator, system images, build-tools. Unlike the NDK this tree is
# NOT pinned — sdkmanager resolves packages against Google's manifest at run time, which is why
# `decisions.md` declares this side non-hermetic. The zip that bootstraps it *is* pinned.
ANDROID_HOME = "$PIXI_PROJECT_ROOT/.android/sdk"
ANDROID_SDK_ROOT = "$PIXI_PROJECT_ROOT/.android/sdk"
ANDROID_NDK_HOME = "$PIXI_PROJECT_ROOT/.android/android-ndk-r27d"
NDK_BIN = "$PIXI_PROJECT_ROOT/.android/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin"
# **The host CFLAGS must be emptied, or nothing cross-compiles.** conda's `c-compiler`
# activation exports host flags — `CFLAGS=-march=nocona -mtune=haswell … -isystem
# <env>/include`, plus `CPPFLAGS` and `LDFLAGS` pointing into the x86-64 environment. The `cc`
# crate applies `CFLAGS` and *appends* `CFLAGS_<target>` rather than letting the specific one
# win, so a per-target override does not rescue it: the Android clang still receives an x86
# `-march` and refuses to compile SQLite.
#
# Emptying them here is safe because every C compile in this build is for the *target*
# (`rusqlite bundled`, `libgit2 vendored`); nothing needs conda's host include path. This is
# the same root cause as the `known-issues.md` trap where a *missing* NDK builds green with
# host objects — conda's C activation is host-shaped, and a cross build has to say so.
CFLAGS = ""
CPPFLAGS = ""
LDFLAGS = ""
CFLAGS_aarch64_linux_android = "-fPIC -O2"
CFLAGS_x86_64_linux_android = "-fPIC -O2"
# `cc` (rusqlite bundled, libgit2/OpenSSL vendored) reads CC_<target>; cargo reads CARGO_TARGET_*.
CC_aarch64_linux_android = "$PIXI_PROJECT_ROOT/.android/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
AR_aarch64_linux_android = "$PIXI_PROJECT_ROOT/.android/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = "$PIXI_PROJECT_ROOT/.android/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS = "-C link-arg=-Wl,-z,max-page-size=16384"
CC_x86_64_linux_android = "$PIXI_PROJECT_ROOT/.android/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
AR_x86_64_linux_android = "$PIXI_PROJECT_ROOT/.android/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER = "$PIXI_PROJECT_ROOT/.android/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS = "-C link-arg=-Wl,-z,max-page-size=16384"

# Prove the core builds for a phone, asserting the ELF machine of every vendored C blob rather
# than the exit code (see the script for why the exit code lies here). Defined on the feature,
# so it resolves to the android environment on its own: `pixi run android-check`.
[feature.android.tasks]
android-check = "sh ci/android-check.sh"
# Stage the bundled model runtime (llama.cpp android-arm64) into jniLibs and enable extract-native-libs
# — the on-device agent's `llama-server`. gen/android is generated, so this runs before every build.
android-stage-runtime = "sh ci/android-stage-runtime.sh"
# Cross-compile whisper.cpp's whisper-server (android-arm64, static) into jniLibs — the phone's
# audio→transcript runtime. Idempotent (version-stamped), so it compiles once then no-ops.
android-stage-whisper = "sh ci/android-stage-whisper.sh"
# Inject the foreground service so Android keeps the app + its network alive for the agent's model
# download and inference (else Doze stalls the download and LMKD can reap the model). Also generated.
android-inject-service = "sh ci/android-inject-service.sh"
# **Does the app actually paint — twice in a row, and after being killed?** The unattended startup +
# closure test, on the emulator only (it installs and force-stops, so it refuses any serial that is
# not `emulator-*`; the phone this is developed against is the owner's personal device). Deliberately
# NOT part of `pixi run ci`, which must stay green with no Android toolchain — run it after touching
# the shell's startup, the boot gate, or before `android-release`. See the script's header.
android-smoke = "sh ci/android-smoke.sh"
# Build the APK. `PATH` puts our `rustup` shim (`ci/bin/rustup`) first — Tauri shells out to
# `rustup target add` and this project has no rustup (targets come from conda-forge, pinned in
# pixi.lock); the shim verifies rather than pretends. **It is tracked**: it sat in the gitignored
# `.android/bin` until 2026-09-03, so this task worked on one machine and nowhere else.
# `JAVA_HOME` is pinned because conda's default JDK is 25, whose class files Gradle 8.14 refuses
# with an error naming neither Java nor Gradle.
# A signed, 16 KB-aligned release APK for a real phone. Keystore in ~/.config/formicaria,
# never in the repo. See the script for why signing is not done in Gradle.
android-release = { cmd = "sh ci/android-release.sh", depends-on = ["android-stage-runtime", "android-stage-whisper", "android-inject-service"] }
android-apk = { cmd = "cd mobile && PATH=$PIXI_PROJECT_ROOT/ci/bin:$PATH NDK_HOME=$ANDROID_NDK_HOME JAVA_HOME=$CONDA_PREFIX/lib/jvm pnpm exec tauri android build --debug --target x86_64", depends-on = ["android-stage-runtime", "android-inject-service"] }
# Install the debug APK on whatever single device adb sees, and launch it.
android-run = { cmd = "$ANDROID_HOME/../platform-tools/adb install -r mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk && $ANDROID_HOME/../platform-tools/adb shell am start -n dev.formicaria.notes/.MainActivity" }
# Create the emulator once. Its data lives in `.android/avd`, not your home directory, so the
# whole Android toolchain stays inside the checkout and `rm -rf .android` is a clean slate.
android-avd = { cmd = "ANDROID_AVD_HOME=$PIXI_PROJECT_ROOT/.android/avd $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n formicaria -k 'system-images;android-35;google_apis;x86_64' -d pixel_6 --force" }
# Boot it headless. `screencap` works without a window, so screenshots need no display — which
# is what makes the UI inspectable from a terminal at all.
android-emu = { cmd = "ANDROID_AVD_HOME=$PIXI_PROJECT_ROOT/.android/avd $ANDROID_HOME/emulator/emulator -avd formicaria -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect" }

# **Type-checking the platforms this machine cannot run.**
#
# `SystemMonitor::sample` has a Windows arm (`GlobalMemoryStatusEx`) and a macOS arm (mach VM
# statistics), and `launch.rs` has a Windows Job Object teardown. None of it compiles here, and on
# 2026-09-02 all of it shipped never having been through a compiler at all. The class of error that
# costs is a `cfg` arm naming a symbol the target does not have — which is exactly how
# `die_with_supervisor` came to call Linux's `prctl` under `#[cfg(unix)]`, a macOS build error that
# went unnoticed for months because nothing on macOS built that crate.
#
# `cargo check` does not link, so a target's `rust-std` is all it needs — no MSVC, no Xcode.
#
# **Its own environment, exactly like `android` above and for the reason stated there**: `pixi run
# ci` must stay green for someone who has downloaded none of this. It matters more here than it
# looks: `pixi.lock` shows the android environment already resolving a *different* rustc (1.97.1)
# from the default (1.97.0), so cross-target std packages in the default environment could quietly
# move the compiler the release is built with.
[feature.cross.dependencies]
rust-std-x86_64-pc-windows-msvc = "*"
rust-std-aarch64-apple-darwin = "*"
# iOS, added 2026-09-02. Both triples, because they are not interchangeable and the difference is
# the one a Linux developer gets wrong: `-ios` is the device, `-ios-sim` is what a Simulator on an
# Apple-silicon runner actually runs — and a Simulator is the only iOS device this project has
# (no Mac, no iPhone; `ios-plan-2026-09-02.md`). conda-forge builds these `noarch`, so they install
# here. This buys the type-check and nothing more: anything with a C build script still needs Xcode.
rust-std-aarch64-apple-ios = "*"
rust-std-aarch64-apple-ios-sim = "*"
# **The third one is not for us — it is for `tauri ios init`, and it is not optional.**
# `cargo-mobile2`'s `project::gen()` calls `Target::install_all()`, which shells out
# `rustup target add` for **every** Apple triple it knows — `aarch64-apple-ios`,
# `x86_64-apple-ios` and `aarch64-apple-ios-sim` — and `?`s on the first failure. The
# `--target aarch64-sim` passed to *build* does not narrow what *init* installs.
#
# Nothing here ever compiles for an Intel Simulator (`macos-latest` is Apple silicon). But
# `ci/bin/rustup` verifies rather than pretends, so an unpinned triple makes it exit 1 and takes
# `tauri ios init` down with it. Rung 1 only passed because no shim was on PATH then and the
# runner's own rustup answered — i.e. the shim, added as a safety measure, is what would have
# broken this. Pinning is the cheap half of the fix: a noarch conda package, versus a
# `--skip-targets-install` flag nothing on this machine can verify.
rust-std-x86_64-apple-ios = "*"

[feature.cross.tasks]
# **`fm-agent` only, and that is the whole of the per-OS code.** Its `watchdog.rs` holds the Windows
# and macOS memory readings and its `launch.rs` the Job Object teardown; everything else that
# differs per platform is a `cfg!(windows)` filename suffix that cannot fail to compile.
#
# The wider crates are deliberately *not* checked here: `fm-agent-run --features download` pulls
# `ureq` -> `rustls` -> `ring`, whose build script compiles C and needs a real MSVC toolchain
# (`failed to find tool "lib.exe"`). That is a full cross-*build* environment, not a type-check, and
# `cross.yml` already compiles those crates on real macOS and Windows runners. This task buys the
# fast half: the errors a compiler finds by reading, in seconds, on this machine.
#
# It earned itself immediately — the first run found a `std::mem::forget` on a raw pointer that did
# nothing, and a deprecated `libc::mach_host_self`, in code that had shipped without ever being
# compiled for either target.
check-cross = """
cargo check --target x86_64-pc-windows-msvc -p fm-agent &&
cargo check --target aarch64-apple-darwin -p fm-agent &&
cargo check --target aarch64-apple-ios -p fm-agent &&
cargo check --target aarch64-apple-ios-sim -p fm-agent
"""

[environments]
default = { features = [] }
media = { features = ["media"] }
android = { features = ["android"] }
cross = { features = ["cross"] }

[tasks]
setup = "git config core.hooksPath .githooks"   # enable the text-only pre-commit guard
test = "cargo test --workspace"
# The `download` feature is off by default (the desktop uses fetch.sh), so `test` above never builds
# the in-app model fetcher. Exercise its hermetic (localhost) tests explicitly, so the single gate
# still covers it.
test-agent-download = "cargo test -p fm-agent-run --features download fetch::"
# **Are the pinned model runtimes still the bytes we recorded?** Downloads ~110 MB, so it is not in
# the routine gate — run it before cutting a release. An upstream asset that was re-uploaded would
# otherwise reach a user as an unexplained checksum failure on their first enable.
check-pins = "cargo test -p fm-agent-run --features download -- --ignored --nocapture every_pinned_runtime"
# Fetch the local agent's runtime + a model into agents/{runtime,models} (both gitignored).
# `pixi run fetch-model` for the lightest default; `pixi run fetch-model <name>` for a specific one.
fetch-model = "bash agents/fetch.sh"
# Stage the audio→transcript runtime (whisper.cpp weights + binary) into agents/{runtime,models}. Then
# enable it: `pixi run agent-serve -- --whisper-port 8082`. Manual-only, laptop v1.
fetch-whisper = "bash agents/fetch-whisper.sh"
# Serve the fetched model as a warm, localhost-only llama-server the agent talks to (Ctrl-C stops it).
serve-model = "bash agents/serve.sh"
# Serve the model TIED to formicaria's life: it stops when fm-serve stops answering (model on with
# the app, off with it — no orphan). Watches fm-serve on :8765 by default.
agent-serve = "bash agents/agent-serve.sh"
# The local web-search proxy (Python stdlib, no key): gives the agent web search on 127.0.0.1:8888.
#   pixi run search-proxy   then   pixi run agent-serve -- --searxng-port 8888
search-proxy = "python3 agents/search-proxy.py 8888"
# The model benchmark on OUR case (not synthetic llama-bench): drive a running llama-server through
# the study-agent workload and append measured numbers to agents/bench/results.md. See agents/bench/README.md.
#   pixi run model-bench -- --url http://127.0.0.1:8081 --model qwen3-4b-2507 --device laptop --pid $(pgrep -x llama-server) --gpu
model-bench = "python3 agents/bench/run.py"
# Invoke the study assistant: propose an edit to one note (never main). Needs a served model.
#   pixi run agent-propose -- --vault . --note <ULID> --ask "..." [--search "..."] [--input <ULID>]
agent-propose = "cargo run -q -p fm-agent-run --bin fm-agent-run --"
# Warm-session chat with the assistant in a note's discussion (RAG over the vault). Needs a served model.
#   pixi run agent-chat -- --vault . --note <ULID>
agent-chat = "cargo run -q -p fm-agent-run --bin agent-chat --"
# Run the app in your browser against the REAL vault — this is how formicaria
# runs. Builds the UI, then serves it + a JSON/bytes API over the same commands,
# and (via FM_OPEN, set by the launcher) opens your default browser. Lean default
# env, no webkit: `pixi run serve`, then open http://127.0.0.1:8765.
#
# BOTH vault vars are load-bearing for the dev loop, and neither is a default the
# binary carries:
#   FM_VAULT=vault  — there is no default vault path any more. Unset means zero
#     vaults and the first-run screen (which is the point: a *relative* default
#     meant a typo, or a launcher started from another cwd, silently created an
#     empty vault while your notes "vanished"). This pins the dev loop to ./vault.
#   FM_VAULTS=.dev-vaults.json — keeps the loop hermetic. vaults.json WINS over
#     FM_VAULT, so without this a developer who creates a vault in the app writes
#     their REAL ~/.config/formicaria/vaults.json, and from then on `pixi run
#     serve` reads that file, ignores FM_VAULT, and ./vault silently disappears.
#     Gitignored. To reach the first-run screen: rm it and unset FM_VAULT.
# **FM_OPEN=0 / FM_AUTO_SHUTDOWN=0 keep the DEV loop as it was.** Both now default to *on* in the
# binary, because a person double-clicking cannot set an environment variable and was otherwise
# left copying an address out of a console window that quietly kept their notebook alive. Neither
# default suits this loop: a browser tab per restart is noise, and here a closed tab means "about
# to reload", not "finished".
serve = { cmd = "pnpm -C ui install && pnpm -C ui build && cargo run -p fm-serve", env = { FM_UI_DIST = "ui/dist", FM_VAULT = "vault", FM_VAULTS = ".dev-vaults.json", FM_OPEN = "0", FM_AUTO_SHUTDOWN = "0" } }
# Same, but the RELEASE build (the [profile.release] in Cargo.toml: stripped +
# thin-LTO, ~3 MB, faster runtime). Slower to compile; what you'd run daily.
serve-release = { cmd = "pnpm -C ui install && pnpm -C ui build && cargo run --release -p fm-serve", env = { FM_UI_DIST = "ui/dist", FM_VAULT = "vault", FM_VAULTS = ".dev-vaults.json", FM_OPEN = "0", FM_AUTO_SHUTDOWN = "0" } }
# Produce the shippable artifacts WITHOUT running them: the optimized binaries at
# `target/release/{fm-serve,fm}` plus the production UI bundle at `ui/dist`. Those
# together ARE the app — run fm-serve from the repo root (it defaults FM_UI_DIST
# to ui/dist), or point FM_UI_DIST elsewhere. This is what you distribute or wire
# the .desktop launcher to.
#
# `fm` is NOT optional here, even though the browser never calls it. `ensure_repo`
# installs the `.md` merge driver by pointing git at the `fm` binary **beside the
# running one**, and refuses to install a driver it cannot find — because a driver
# git can't execute is worse than none (git reads the failure as a conflict and
# hands back ours with no markers, so you resolve a normal-looking file and delete
# your collaborator's edit). Build fm-serve alone and the merge driver silently
# never installs: every concurrent edit conflicts on the `updated:` line, which is
# the exact thing Phase 1 exists to prevent. Ask how this was found.
# **`depends-on = ["docs"]` is load-bearing, not tidiness.** Since 2026-08-28 `fm-serve` bakes
# `docs/book` into the binary at compile time, exactly as it bakes `ui/dist`. Without this the
# release workflow's order — `pixi run build`, and only later `pixi run docs` — compiles against a
# `docs/book` that does not exist yet, and ships a binary whose in-app Help is empty while the
# `manual/` folder beside it is perfectly correct. Nothing fails; the button just does nothing.
# `agent-serve` is built here too since 2026-09-02: it is the assistant's supervisor, and the
# release archive now carries it so a *downloaded* copy can run the assistant without a checkout.
# Before that this line built only fm-serve + fm-cli, which is why `fm-agent-run` never reached a
# release and the archive could carry no assistant at all.
build = { cmd = "pnpm -C ui install && pnpm -C ui build && cargo build --release -p fm-serve -p fm-cli -p fm-agent-run --features fm-agent-run/download", depends-on = ["docs"] }
# The debug counterpart: unoptimized binaries with full debuginfo at
# `target/debug/{fm-serve,fm}` (fast to compile, large + slow) for stepping through
# the server. Pairs with the same `ui/dist`. `fm` for the same reason as above.
build-debug = { cmd = "pnpm -C ui install && pnpm -C ui build && cargo build -p fm-serve -p fm-cli", env = { FM_UI_DIST = "ui/dist" }, depends-on = ["docs"] }
# Run the ALREADY-BUILT release binary — NO rebuild — inside the activated env
# (so `pdftotext`/`vipsthumbnail` are on PATH for ingest). This is what the
# desktop launcher runs, so a double-click starts instantly; update what it runs
# by rebuilding explicitly with `pixi run build`. Assumes `pixi run build` has
# produced `target/release/fm-serve` + `ui/dist`.
#
# Deliberately gets NO FM_VAULT/FM_VAULTS, unlike `serve`: this is the launcher,
# and a double-click on a machine with no vaults landing on the first-run screen
# IS the feature. Consequence, stated: `pixi run app` from the repo root does not
# see ./vault — it reads your real ~/.config/formicaria/vaults.json, like a
# released install would.
app = "target/release/fm-serve"
test-ui = "pnpm -C ui install && pnpm -C ui test"   # Vitest: the markdown->HTML render seam (jsdom, no window)
# svelte-check over every component. `vite build` does NOT typecheck — it strips types and
# emits — so a `.svelte` file that calls a function it never imported *builds clean* and
# throws ReferenceError in the browser at the moment that code path runs. That is a whole
# class of bug the Vitest suite cannot see either, because it only covers the modules it
# imports. Found the hard way: a blob-URL helper used in NotePanel without the import.
check-ui = "pnpm -C ui install && pnpm -C ui check"
seam = "cargo test -p fm-query"                  # the zero-I/O seam suite
perf = "cargo test -p fm-query --test perf -- --nocapture"   # search < 100ms @ 10k budget
deny = "cargo deny --all-features check"         # license / advisory gate (permissive-only)
checks = "sh ci/checks.sh"                       # architectural greps: seam + generic renderers
# The notices that must ship WITH a binary — MIT and Apache-2.0 both require it, and ~87
# crates under them are linked in. Generated from the real dependency tree (a hand-kept
# list goes stale the first time someone adds a crate); the release workflow drops the
# output into every archive.
third-party = "sh ci/third-party.sh"
# Renders the manual FOR THIS MACHINE'"'"'S OS — the setup chapter is assembled from
# `user/setup-<os>.md` first, because each release archive should carry instructions for its own
# platform and nobody else'"'"'s. Broken links still fail the build. `FM_DOCS_OS=windows pixi run docs`
# to preview another platform.
docs = "sh ci/docs.sh"
# Unpack the Android toolchain into a gitignored `.android/`, each artifact verified against
# its SHA-256 in `android/toolchain.lock`. The NDK/SDK/platform-tools have no conda packaging,
# so they cannot ride in `pixi.lock` — but "outside pixi" must not become "outside the
# project": a `sudo apt install` dependency is one this repo can neither pin nor remove. Every
# piece Google ships is a standalone zip, so it lives in the tree instead.
#
# Deliberately NOT in `pixi run ci`: a contributor with no Android toolchain must still get a
# green gate. Opt-in, and the only thing that writes `.android/`.
# Grade the in-process git backend against the subprocess one. Not in `pixi run ci`: the
# feature builds libgit2 + OpenSSL from source, which a contributor with no interest in mobile
# must not pay for. Run it whenever `git_native.rs` or the rules it shares change.
#
# **The two merge suites are here because `pixi run ci` cannot reach them.** `cargo test
# --workspace` builds without the feature, so `merge_differential`'s native gate is `cfg`-ed out
# and `merge_on_a_device_without_git` vanishes entirely — the body engine the phone actually uses
# would be covered by nothing at all. That is how the shell-out survived: green everywhere, on a
# path the phone could not take.
test-native-git = { cmd = "cargo test -p fm-core --features native-git --test git_differential && cargo test -p fm-core --features native-git --test merge_differential && cargo test -p fm-core --features native-git --test merge_on_a_device_without_git && cargo test -p fm-cli --features native-git --test git_native_merge && cargo test -p fm-cli --features native-git --test collaboration_pipeline && cargo test -p fm-cli --features native-git --test mixed_device_collaboration && cargo test -p fm-cli --features native-git --test conflict_resolution_both_devices && cargo test -p fm-app --features native-git --test backup_records_everything -- --test-threads=1" }
android-init = "sh ci/android-init.sh"
# Pull a workflow run's logs + artifacts into `.ci-logs/` so they can be read locally. Written for
# `ios.yml`, the one workflow this project has no other way to observe — no Mac, no iPhone, so the
# run's log is the whole experiment. Takes any workflow: `pixi run ci-logs cross.yml`.
ci-logs = "sh ci/ios-logs.sh"

# **Does the app boot on an iOS Simulator, twice in a row?** The analogue of `android-smoke`, and
# like it deliberately NOT part of `pixi run ci`. It is macOS-only and refuses to run anywhere else:
# this project has no Mac, so in practice it runs in `.github/workflows/ios.yml` (rung 2) and the
# task exists so the CI job invokes a script rather than a wall of YAML. See the script's header.
ios-smoke = "sh ci/ios-smoke.sh"

[tasks.ci]
depends-on = ["test", "test-agent-download", "test-ui", "check-ui", "deny", "checks", "docs"]
