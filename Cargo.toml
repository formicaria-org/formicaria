# formicaria — Rust workspace.
#
# Seam 1 (the query engine never touches the filesystem) is a COMPILE-TIME
# guarantee: fm-model and fm-query do not depend on rusqlite, std::fs, or any
# path type, so the engine physically cannot do I/O. fm-core holds the I/O
# (FileStore = markdown + SQLite); fm-cli drives it; the Tauri app (fm-app) joins
# in a later slice.
[workspace]
resolver = "2"
members = ["crates/fm-model", "crates/fm-query", "crates/fm-core", "crates/fm-cli", "crates/fm-app", "crates/fm-serve", "crates/fm-agent", "crates/fm-agent-run",
    "crates/fm-fetch",
    "crates/fm-update"]
# The mobile shell is deliberately NOT a member. It pulls Tauri and, through
# `fm-core/native-git`, libgit2 + OpenSSL — none of which a desktop contributor should have to
# resolve, and none of which `pixi run ci` should build. It has its own lockfile and is built
# only by the Android tasks.
exclude = ["mobile/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT"

[workspace.dependencies]
fm-model = { path = "crates/fm-model" }
fm-query = { path = "crates/fm-query" }
fm-core = { path = "crates/fm-core" }
ulid = "1"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
indexmap = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

# Release profile — the shipped binary. The debug `fm-serve` is ~34 MB
# (unoptimized + full debuginfo); stripping symbols plus LTO brings the release
# build down to ~3 MB. opt-level 3 keeps the pure query engine fast; thin LTO +
# a single codegen unit trade release compile time for a smaller, faster binary.
# No behavior change — panics still unwind; we only drop debug symbols and inline
# across crates. Build it with `pixi run build` (or run it via `pixi run
# serve-release`).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
