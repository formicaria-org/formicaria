# formicarium — Rust workspace.
#
# Seam 1 (the query engine never touches the filesystem) is a COMPILE-TIME
# guarantee: fm-model and fm-query do not depend on rusqlite, std::fs, or any
# path type, so the engine physically cannot do I/O. fm-core holds the I/O
# (FileStore = markdown + SQLite); fm-cli drives it; the Tauri app (fm-app) joins
# in a later slice.
[workspace]
resolver = "2"
members = ["crates/fm-model", "crates/fm-query", "crates/fm-core", "crates/fm-cli", "crates/fm-app", "crates/fm-serve"]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fm-model = { path = "crates/fm-model" }
fm-query = { path = "crates/fm-query" }
fm-core = { path = "crates/fm-core" }
ulid = "1"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
indexmap = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

# Release profile — the shipped desktop binary. The debug build is ~227 MB
# (unoptimized + full debuginfo); stripping symbols plus LTO brings a release
# build down to roughly 10-25 MB. opt-level 3 keeps the pure query engine fast;
# thin LTO + a single codegen unit trade release compile time for a smaller,
# faster binary. No behavior change — panics still unwind (Tauri relies on it);
# we only drop debug symbols and inline across crates.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
