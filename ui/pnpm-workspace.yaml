# Security pins for transitive dependencies the direct ones have not caught up with yet (2026-10-09).
# Each lifts a package to its first fixed release within the version line its parent uses (nanoid 4
# → 5 is the one line change; its API is unchanged). Remove an entry once `pnpm audit` is clean
# without it.
#
# `chokidar` 3 → 4 removes `braces` entirely (its advisory names a fix, 3.0.4, that is not published).
# The only `chokidar` 3 here is under Excalidraw's pinned `sass` 1.51, which uses it for its own
# command-line `--watch` mode — something neither the build nor the app ever runs.
overrides:
  "nanoid@<3.3.18": "^3.3.18"
  "nanoid@>=4.0.0 <5.1.16": "^5.1.16"
  "lodash-es@<4.17.24": "^4.18.1"
  "postcss@<8.5.23": "^8.5.23"
  "undici@<7.29.1": "^7.29.1"
  "source-map-js@<1.2.2": "^1.2.2"
  "chokidar@<4": "^4.0.3"
  "katex@<0.18.2": "0.18.10"
