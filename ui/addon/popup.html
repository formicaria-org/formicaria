<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 14px; width: 280px; color: #1d2b27; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      p { margin: 6px 0; }
      .muted { color: #5b6b66; font-size: 12px; }
      button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #2f5d50; background: #2f5d50; color: #fff; cursor: pointer; }
      .err { color: #9b2c2c; }
      ul { margin: 6px 0; padding-left: 16px; }
      li { margin: 4px 0; }
      li .muted { overflow-wrap: anywhere; }
      fieldset { border: none; border-top: 1px solid #e6e5e0; margin: 10px 0 0; padding: 8px 0 0; font-size: 12px; }
      legend { color: #5b6b66; padding: 0; }
      fieldset label { display: block; margin: 3px 0; }
    </style>
  </head>
  <body>
    <h1 id="head">Saving this page…</h1>
    <p id="what" class="muted"></p>
    <ul id="notes" hidden></ul>
    <p><button id="open" hidden>Open in formicaria</button> <button id="again" hidden>Save again</button> <button id="link" hidden>Just the link instead</button></p>
    <fieldset>
      <legend>After you select something on a page</legend>
      <label><input type="radio" name="after" value="offer" /> Offer to bring it in</label>
      <label><input type="radio" name="after" value="bring" /> Bring it in at once (hold Alt to just select)</label>
      <label><input type="radio" name="after" value="nothing" /> Nothing</label>
    </fieldset>
    <script src="popup.js"></script>
  </body>
</html>
