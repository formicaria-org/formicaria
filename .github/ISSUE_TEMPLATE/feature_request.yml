name: Idea
description: Something the app could do that it does not.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Two files are worth thirty seconds first, because they will tell you whether this is
        already queued or already settled:

        - [`docs/context/outstanding.md`](../blob/main/docs/context/outstanding.md) — what is known
          to be missing, with the reasoning.
        - [`CONTRIBUTING.md`](../blob/main/CONTRIBUTING.md#what-is-not-wanted) — what is
          deliberately not wanted, and why. A plugin API, a block editor and real-time
          collaboration are all on that list.

        Neither is meant to shut the idea down. A settled question can be reopened by a new
        argument — it just needs to be a new one.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the feature. What the app makes you do instead is the most useful part of an idea, and the part a maintainer cannot guess.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you think would fix it
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: A workaround that nearly works says a lot about where the real gap is.
