# Release binaries: built ONCE, on a tag or on demand — never on an ordinary push.
#
# Its own file because a `push` trigger with both `paths:` and `tags:` is **ANDed** by
# GitHub, so a tag that happened to touch no source path would silently never build. The
# gate lives in ci.yml (linux, every push) and cross.yml (macos/windows, path-filtered);
# this only produces artifacts, so it does not re-run the tests.
#
# What ships is an *app*, not a build output: both binaries and the instructions for using
# them, in one archive named after the platform it actually runs on.
name: release

# **Re-enabled 2026-08-28 on the owner's instruction**: cutting a `v*` tag builds the
# release again, unattended. This workflow is the deliberate *exception* to the 2026-07-18
# no-remote-CI standing order — `ci.yml`, `cross.yml` and `docs.yml` stay `workflow_dispatch`-
# only. The exception is worth its cost because a release that must be fired by hand is a
# release that silently does not exist: the tag lands, nothing builds, and the gap is only
# noticed by someone looking for a download that was never produced.
on:
  push:
    tags: ['v*']
  # "I want a binary from this commit" without cutting a tag.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `target` is what a user reads in the filename, so it names the real thing:
          # the macOS runner is Apple silicon, and "macos-latest" tells nobody whether the
          # binary will run on their machine.
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pixi run build

      # Stage the app: both binaries + the instructions. `fm` is NOT optional beside
      # `fm-serve` — `ensure_repo` installs the `.md` merge driver by pointing git at the
      # `fm` binary *beside the running one*, and installs nothing when it cannot find one,
      # so a bundle carrying only fm-serve silently loses the merge driver.
      - name: stage
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Only a dispatch on a *branch* gets the dev- stamp. Under the no-remote-CI standing
          # order the `v*` push trigger is off, so firing this by hand on a tag is now the only
          # way to cut a release — and without the ref-type test that path named its archives
          # `formicaria-dev-<sha>-*` and attached them to a `v*` release. GITHUB_REF_TYPE is
          # exactly `tag` or `branch`, so it separates the two cases the event name cannot.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          DIR="formicaria-${VERSION}-${{ matrix.target }}"
          mkdir -p "stage/${DIR}"
          for b in fm-serve fm; do
            if [ -f "target/release/${b}.exe" ]; then
              cp "target/release/${b}.exe" "stage/${DIR}/"
            else
              cp "target/release/${b}" "stage/${DIR}/"
            fi
          done
          cp packaging/README-release.md "stage/${DIR}/README.md"
          # Our licence, plus the notices of the ~87 crates linked into the binary —
          # MIT and Apache both require those to travel with it. Generated from the real
          # dependency tree, never hand-maintained.
          cp LICENSE "stage/${DIR}/"
          pixi run sh ci/third-party.sh "stage/${DIR}/THIRD-PARTY.md"

          # **The manual ships WITH the app.** `docs.yml` only ever built the book as a link
          # check and threw the HTML away with the runner — no artifact, no Pages deploy — and
          # README.md beside it is an install sheet, not documentation. So every release so far
          # handed the user the whole application and no instructions for using it, with the
          # ~11,600 words in `docs/src` reachable only by cloning the repo.
          pixi run docs
          # Assert the artifact, not the exit code. Two things here fail silently, and both
          # produce an archive that looks documented until someone opens it:
          #   1. mdbook can exit 0 having written nothing if `book.toml` or `src/` moves. A
          #      `manual/` that exists and is empty is worse than no `manual/` at all.
          #   2. `docs/src` is a TREE (user/, dev/, reference/). A `*.md` glob copies exactly
          #      SUMMARY.md and introduction.md and drops the other fourteen pages without a
          #      word — every chapter a user actually needs. Hence `cp -R <dir>/.`, which copies
          #      contents (and dodges the GNU/BSD disagreement over `-R dir/`), verified by
          #      `diff -r` against the source tree.
          #
          # `diff -r` rather than counting files: it compares structure AND content, needs no
          # number to keep up to date as chapters are added, and — the reason it is not `find`
          # — `find` on the Windows runner can resolve to Windows' own `find.exe`, which is a
          # text search with entirely different semantics. `diff` is unambiguous on all three.
          [ -s docs/book/index.html ] || { echo "stage: mdbook produced no docs/book/index.html" >&2; exit 1; }
          mkdir -p "stage/${DIR}/manual/source"
          cp -R docs/book/. "stage/${DIR}/manual/"
          cp -R docs/src/.  "stage/${DIR}/manual/source/"
          diff -r docs/src "stage/${DIR}/manual/source" >/dev/null \
            || { echo "stage: manual/source does not match docs/src" >&2; exit 1; }

          echo "DIR=${DIR}" >> "$GITHUB_ENV"
          ls -la "stage/${DIR}"

      - name: archive
        shell: bash
        run: |
          set -euo pipefail
          cd stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../${DIR}.zip" "${DIR}" >/dev/null
          else
            tar czf "../${DIR}.tar.gz" "${DIR}"
          fi
          cd ..
          ls -la formicaria-*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIR }}
          if-no-files-found: error
          path: formicaria-*.${{ matrix.archive }}

  attach:
    name: attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
