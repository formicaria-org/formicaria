# Release binaries: built ONCE, on a tag or on demand — never on an ordinary push.
#
# Its own file because a `push` trigger with both `paths:` and `tags:` is **ANDed** by
# GitHub, so a tag that happened to touch no source path would silently never build. The
# gate lives in ci.yml (linux, every push) and cross.yml (macos/windows, path-filtered);
# this only produces artifacts, so it does not re-run the tests.
name: release

on:
  push:
    tags: ['v*']
  # "I want a binary from this commit" without cutting a tag.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: pixi run build
      # `fm` is NOT optional beside `fm-serve`: `ensure_repo` installs the `.md` merge
      # driver by pointing git at the `fm` binary *beside the running one*, and installs
      # nothing when it cannot find one — so a bundle carrying only fm-serve silently
      # loses the driver. Both, always.
      - uses: actions/upload-artifact@v4
        with:
          name: formicaria-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/fm-serve
            target/release/fm
            target/release/fm-serve.exe
            target/release/fm.exe

  attach:
    name: attach to the tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: package
        run: |
          cd dist
          for os in */; do (cd "$os" && zip -qr "../${os%/}.zip" .); done
          ls -la ./*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
