# Release binaries: built ONCE, on a tag or on demand — never on an ordinary push.
#
# Its own file because a `push` trigger with both `paths:` and `tags:` is **ANDed** by
# GitHub, so a tag that happened to touch no source path would silently never build. The
# gate lives in ci.yml (linux, every push) and cross.yml (macos/windows, path-filtered);
# this only produces artifacts, so it does not re-run the tests.
#
# What ships is an *app*, not a build output: both binaries and the instructions for using
# them, in one archive named after the platform it actually runs on.
name: release

# **Re-enabled 2026-08-28 on the owner's instruction**: cutting a `v*` tag builds the
# release again, unattended. This workflow was the deliberate *exception* to the 2026-07-18
# no-remote-CI standing order, and it is worth restating **why**, because that order is now
# superseded (`decisions.md`, *the repo goes public…*, 2026-09-04) and the exception is not:
# a release that must be fired by hand is a release that silently does not exist. The tag lands,
# nothing builds, and the gap is noticed only by someone looking for a download that was never
# produced. That was never an argument about minutes, so free minutes do not change it.
#
# **The corollary is the thing to remember: pushing a `v*` tag publishes a release.** This is the
# one workflow in the repo that can be started by accident.
on:
  push:
    tags: ['v*']
  # "I want a binary from this commit" without cutting a tag.
  workflow_dispatch:

# **Read at the top; write only where publishing happens.** The `binaries` job compiles and
# packages and needs nothing more than the tree; the `attach` job below re-declares
# `contents: write` for itself, because creating a release is exactly what that scope is for.
# One elevated job, stated, rather than five jobs inheriting whatever the repository default is.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `target` is what a user reads in the filename, so it names the real thing:
          # the macOS runner is Apple silicon, and "macos-latest" tells nobody whether the
          # binary will run on their machine.
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # **Pinned, and this is the whole reason the cache ever hits.**
          # setup-pixi keys its cache on sha256(pixi.lock)+environments+**sha256(the pixi
          # binary)**+path+cwd, and passes NO restoreKeys - it is exact-match or a full
          # miss. Unpinned, every pixi release (roughly fortnightly) rotates that key for
          # every workflow here at once, so a manually-dispatched job almost never hits.
          pixi-version: v0.72.2
          run-install: true
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      # `pixi run build` opens with `pnpm -C ui install`, so without this every release re-fetches
      # the whole JS dependency tree on three runners. The store, not `node_modules` — see the
      # android job for why.
      - name: pnpm store path
        id: pnpm
        shell: bash
        run: echo "dir=$(pixi run pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      # **The version, before the build rather than after it**, because the binary has to carry
      # it: the crates are all `0.0.0` and the real version is this tag. `fm-app` reads it through
      # `option_env!("FM_VERSION")` and falls back to `dev`, so an ordinary local `cargo build`
      # still compiles with nothing set. Settings shows it — which is how someone with two
      # unpacked folders can tell which one they are running.
      - name: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Only a dispatch on a *branch* gets the dev- stamp. Under the no-remote-CI standing
          # order the `v*` push trigger is off, so firing this by hand on a tag is now the only
          # way to cut a release — and without the ref-type test that path named its archives
          # `formicaria-dev-<sha>-*` and attached them to a `v*` release. GITHUB_REF_TYPE is
          # exactly `tag` or `branch`, so it separates the two cases the event name cannot.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "FM_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - run: pixi run build

      # Stage the app: both binaries + the instructions. `fm` is NOT optional beside
      # `fm-serve` — `ensure_repo` installs the `.md` merge driver by pointing git at the
      # `fm` binary *beside the running one*, and installs nothing when it cannot find one,
      # so a bundle carrying only fm-serve silently loses the merge driver.
      - name: stage
        shell: bash
        run: |
          set -euo pipefail
          # Computed once, in the `version` step above, and baked into the binary there — so the
          # archive's name and the version the app reports can never disagree.
          DIR="formicaria-${VERSION}-${{ matrix.target }}"

          # **The top level is what a non-technical user sees, so almost nothing lives there.**
          # A tester unzipped v0.2.0, met nine entries of which three looked launchable, opened
          # the `manual` folder, found "many miscellaneous files", and could not tell what to
          # click. The machinery now lives in `program/`; the top level is a door, a manual, a
          # readme and your notes.
          mkdir -p "stage/${DIR}/program"
          # `agent-serve` rides along: it is the assistant's supervisor, spawned by `fm-serve` from
          # beside its own binary. Without it in the archive a downloaded copy has no assistant on
          # any platform — which is exactly what was true until 2026-09-02. The model and the model
          # runtime are NOT staged: they are per-platform and gigabytes, and are fetched on first
          # enable after the app has asked.
          for b in fm-serve fm agent-serve; do
            if [ -f "target/release/${b}.exe" ]; then
              cp "target/release/${b}.exe" "stage/${DIR}/program/"
            else
              cp "target/release/${b}" "stage/${DIR}/program/"
            fi
          done
          # The model catalogue, beside the binaries: `fm-serve` reads it to know what it *could*
          # download and what each one costs, and copies it into the tools directory on first use —
          # the same shape as the phone writing its embedded copy on every start.
          cp agents/models.toml "stage/${DIR}/program/models.toml"
          [ -s "stage/${DIR}/program/models.toml" ] \
            || { echo "stage: the model catalogue did not land" >&2; exit 1; }

          # `fm` moves WITH `fm-serve` and that is not incidental: `ensure_repo` installs the
          # `.md` merge driver by pointing git at the `fm` beside the running binary, and
          # installs nothing when it cannot find one. They stay in the same directory forever.

          # **Plain text, not Markdown.** The tester's words: "I would prefer it to be in a
          # format where I can open it in Notepad as I'm unable to open in MD file format."
          # Double-clicking a `.md` on Windows offers an app picker; `.txt` opens Notepad. On
          # Windows it also needs CRLF, because Notepad on older Windows 10 renders LF-only text
          # as one unbroken line — which is a readme nobody can read.
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            sed 's/$/\r/' packaging/README-release.txt > "stage/${DIR}/README.txt"
          else
            cp packaging/README-release.txt "stage/${DIR}/README.txt"
          fi

          # Our licence, plus the notices of everything the binary carries — the ~188 crates,
          # the npm packages baked into `ui/dist`, and the bundled font families. MIT, Apache-2.0
          # and OFL all require those to travel with it. Beside the binaries they describe, not
          # in the user's way.
          cp LICENSE "stage/${DIR}/program/"
          # **Copied, not regenerated here.** It used to be regenerated on each runner, which
          # made the notice host-dependent and made a tag the first place it was ever computed.
          # Both are now wrong: `ci/third-party.sh` resolves with `--target all`, so the file is
          # identical on every platform, and `pixi run ci` fails if the committed copy has
          # drifted (`ci/third-party-check.sh`). So the archive ships the copy a human reviewed,
          # and generation stays on the gate where a red result is cheap — rather than inside the
          # one workflow that fires unattended on a tag, on runners where the generator's `pnpm
          # licenses list` step has never been exercised.
          cp THIRD-PARTY.md "stage/${DIR}/program/THIRD-PARTY.md"
          # Assert the artifact, not the exit code: a notice that arrives empty or truncated is
          # a licence violation that looks like a success. All four sections or nothing.
          for want in "## Bundled into the user interface" "## Fonts bundled" "## Downloaded at runtime"; do
            grep -qF "${want}" "stage/${DIR}/program/THIRD-PARTY.md" \
              || { echo "stage: THIRD-PARTY.md is missing the section '${want}'" >&2; exit 1; }
          done

          # **The manual ships WITH the app.** `docs.yml` only ever built the book as a link
          # check and threw the HTML away with the runner — no artifact, no Pages deploy — and
          # README.md beside it is an install sheet, not documentation. So every release so far
          # handed the user the whole application and no instructions for using it, with the
          # ~11,600 words in `docs/src` reachable only by cloning the repo.
          pixi run docs
          # Assert the artifact, not the exit code. Two things here fail silently, and both
          # produce an archive that looks documented until someone opens it:
          #   1. mdbook can exit 0 having written nothing if `book.toml` or `src/` moves. A
          #      `manual/` that exists and is empty is worse than no `manual/` at all.
          #   2. `docs/src` is a TREE (user/, dev/, reference/). A `*.md` glob copies exactly
          #      SUMMARY.md and introduction.md and drops the other fourteen pages without a
          #      word — every chapter a user actually needs. Hence `cp -R <dir>/.`, which copies
          #      contents (and dodges the GNU/BSD disagreement over `-R dir/`), verified by
          #      `diff -r` against the source tree.
          #
          # `diff -r` rather than counting files: it compares structure AND content, needs no
          # number to keep up to date as chapters are added, and — the reason it is not `find`
          # — `find` on the Windows runner can resolve to Windows' own `find.exe`, which is a
          # text search with entirely different semantics. `diff` is unambiguous on all three.
          mkdir -p "stage/${DIR}/manual/source"
          cp -R docs/book/. "stage/${DIR}/manual/"
          cp -R docs/src/.  "stage/${DIR}/manual/source/"
          # Assert the **staged** entry point, not `docs/book/index.html`. `manual/index.html` is
          # the path the archive's own README tells the reader to open, so it is the path the build
          # owes them; checking mdbook's output directory instead asserts the tool one step short of
          # the artifact, and `cp -R docs/book/. …` over an empty book succeeds silently either way.
          [ -s "stage/${DIR}/manual/index.html" ] \
            || { echo "stage: no manual/index.html in the archive — mdbook produced nothing" >&2; exit 1; }
          diff -r docs/src "stage/${DIR}/manual/source" >/dev/null \
            || { echo "stage: manual/source does not match docs/src" >&2; exit 1; }

          # **The double-click way in.** Without a launcher a release is a bare console binary:
          # no browser opens (FM_OPEN unset), the server is never stopped by closing the tab
          # (FM_AUTO_SHUTDOWN unset), and the notes have nowhere to go. Those three features all
          # existed already and were simply unreachable from a download, because the only scripts
          # that set them assume a git checkout. These resolve everything from the archive's own
          # folder, which is what makes the folder portable.
          # Pipe-separated because every name now contains a space — the whole point of the
          # rename — and word-splitting would turn each into two missing files.
          #
          # **Each platform also gets its update script.** The vault lives inside this folder, so
          # a new download starts empty and someone's notes are still in the folder they had
          # before — which looks exactly like the update destroyed them. The script copies the old
          # vault in, never the other way, and never deletes. Windows gets the `.bat` and not a
          # `.vbs`: the launcher is right to be silent, an update is not.
          case "${{ matrix.target }}" in
            windows-*) launchers="Start formicaria.vbs|Start formicaria (show messages).bat|Update from an older folder.bat" ;;
            macos-*)   launchers="Start formicaria.command|Update from an older folder.command" ;;
            *)         launchers="Start formicaria.sh|Update from an older folder.sh" ;;
          esac
          # Names, not just files. "Start formicaria" answers the question a first-time user
          # actually has; `fm-serve.exe` answered a different one, and `formicaria.vbs` beside
          # `formicaria.bat` beside `fm-serve.exe` offered three plausible answers at once.
          IFS='|'
          for l in $launchers; do
            cp "packaging/launcher/$l" "stage/${DIR}/$l"
            # Assert the staged file, the same as the manual above: a missing launcher would not
            # fail the build, it would ship an archive that no non-technical user can open.
            [ -s "stage/${DIR}/$l" ] || { echo "stage: launcher $l did not land in the archive" >&2; exit 1; }
            case "$l" in *.sh|*.command) chmod +x "stage/${DIR}/$l" ;; esac
          done
          unset IFS

          # **One obvious door to the manual.** The book is ~50 files and its entry point is only
          # obvious to someone who already knows it is `index.html` — which is exactly what the
          # tester could not know. This sits one level up and redirects.
          cp packaging/launcher/Manual.html "stage/${DIR}/Manual.html"
          [ -s "stage/${DIR}/Manual.html" ] || { echo "stage: Manual.html did not land" >&2; exit 1; }

          # A ready vault with **one note in it**. Empty was already better than asking a
          # brand-new user to invent a location before seeing the app — but an empty notebook
          # still answers none of "what is this, and where do I click". The note does, in about
          # three hundred words, and says at the end that it can be deleted.
          #
          # It lives here rather than being generated by the app because the vault must be a
          # plain folder of files either way: copying this folder to a USB stick copies the
          # notes, and that stays true of the first one.
          mkdir -p "stage/${DIR}/vault/notes"
          cp -R packaging/welcome/notes/. "stage/${DIR}/vault/notes/"

          # Date it with the build. The file carries a real date so it parses on its own — if this
          # step ever stops running, the note still works, it is just older. Fail-safe, not silent.
          # No `sed -i`: its spelling differs on macOS and this runs on three platforms.
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for f in "stage/${DIR}/vault/notes/"*.md; do
            sed -e "s/^created: .*/created: ${NOW}/" -e "s/^updated: .*/updated: ${NOW}/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          ls "stage/${DIR}/vault/notes/"*.md >/dev/null \
            || { echo "stage: the welcome note did not land in the vault" >&2; exit 1; }

          echo "DIR=${DIR}" >> "$GITHUB_ENV"
          ls -la "stage/${DIR}"

      - name: archive
        shell: bash
        run: |
          set -euo pipefail
          cd stage
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../${DIR}.zip" "${DIR}" >/dev/null
          else
            tar czf "../${DIR}.tar.gz" "${DIR}"
          fi
          cd ..
          ls -la formicaria-*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIR }}
          if-no-files-found: error
          path: formicaria-*.${{ matrix.archive }}

  # ===============================================================================================
  # The two phone builds. **Both are `continue-on-error: true`, and that is the whole design.**
  #
  # `decisions.md` (2026-09-09, *every platform is published by the tag*) reverses the rule that
  # kept iOS out of this file. What that rule was really protecting is kept here instead, as a
  # property rather than a prohibition: **a phone build can never cost you the desktop release.**
  # Both legs depend on things this project does not control — Apple's SDK, reachable only inside
  # whatever Xcode `macos-latest` happens to be today, and ~1 GB of Google's Android toolchain. The
  # `macos-latest` image moved to macOS 26 on 2026-09-09 and broke the iOS build the same
  # afternoon, with no notice; had that been a blocking leg, it would have broken the release.
  #
  # So a failed phone job leaves a release with three desktop archives and a missing phone asset,
  # which is exactly where this project was before, and never a release that did not happen.
  # `ci/checks.sh` asserts the `continue-on-error` on both.
  # ===============================================================================================
  ios:
    name: iphone ipa
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.2
          environments: >-
            default
            cross
          run-install: true
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            mobile/src-tauri -> target
          cache-on-failure: true
          shared-key: ios
      - name: pnpm store path
        id: pnpm
        shell: bash
        run: echo "dir=$(pixi run -e cross pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/pnpm-lock.yaml', 'mobile/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}"    >> "$GITHUB_ENV"
          echo "FM_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: the frontend
        run: |
          pixi run -e cross pnpm -C ui install --frozen-lockfile
          pixi run -e cross pnpm -C ui build
          pixi run -e cross pnpm -C mobile install --frozen-lockfile
      # `ios-package` is the same script `ios.yml` rung 5 runs, and it **fails the job** unless the
      # artifact is device-platform, single-arm64, unsigned, free-team-signable and carries the four
      # usage descriptions. That is why an unsigned binary is safe to publish: it only exists if it
      # passed all of them.
      - name: build and check the unsigned device ipa
        run: pixi run -e cross ios-package
      # Named like the desktop archives, because it sits beside them on the release page.
      - name: name it for the release
        shell: bash
        run: |
          set -euo pipefail
          src=$(find mobile/src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -type f | head -1)
          [ -n "$src" ] || { echo "no .ipa produced" >&2; exit 1; }
          cp "$src" "formicaria-${VERSION}-ios-arm64.ipa"
          ls -la formicaria-*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          if-no-files-found: error
          path: formicaria-*.ipa

  # ===============================================================================================
  # **Android is two jobs, and the seam is the point.**
  #
  # Building this APK compiles the whole Rust workspace — hundreds of crates, each free to run a
  # `build.rs` — plus npm and a cmake cross-compile of whisper.cpp. If the keystore were on that
  # machine, any one of them could read it. That is the largest exposure in the signing story and
  # nothing about *how the secret is passed* touches it: the key is on disk because `apksigner`
  # needs it there.
  #
  # So `android-build` holds **no secret at all**, and `android-sign` runs `apksigner` and nothing
  # else, on a fresh runner. Hundreds of third-party build scripts able to read the key becomes one
  # Google-published binary — and a build script cannot leave something behind to wait for the key,
  # because the key never appears on that machine. (`decisions.md`, 2026-09-09.)
  # ===============================================================================================
  android-build:
    name: android apk (build)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.2
          environments: >-
            default
            android
          run-install: true
          cache: true
      # **Both workspaces.** The Android build compiles into `mobile/src-tauri/target`, not the root
      # one — caching only `. -> target` would cache the half this job does not use. `ios.yml` has
      # named both since it was written; this job was added later and did not.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            mobile/src-tauri -> target
          shared-key: android
          cache-on-failure: true
      # ~1 GB of NDK/SDK, verified against `android/toolchain.lock` — *"the checksum, not the URL,
      # is the assertion"*. **It also carries `.android/whisper-src`**, where
      # `ci/android-stage-whisper.sh` clones and cross-compiles whisper.cpp, so the cmake build is
      # restored with it rather than repeated — that is the slowest single step in this job.
      - name: cache the android toolchain
        uses: actions/cache@v6
        with:
          path: .android
          key: android-toolchain-${{ hashFiles('android/toolchain.lock') }}
      - name: the android toolchain
        run: pixi run android-init
      # **Cache pnpm's STORE, never node_modules** — the pattern `cross.yml` and `ios.yml` document:
      # pnpm fills `node_modules` with symlinks into a content-addressable store elsewhere, so
      # caching `node_modules` restores dangling links and pnpm then reports "Already up to date"
      # and repairs nothing. The store is content-addressed, which is why `restore-keys` is safe.
      - name: pnpm store path
        id: pnpm
        shell: bash
        run: echo "dir=$(pixi run -e android pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/pnpm-lock.yaml', 'mobile/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      # **Without this the job cannot build at all.** `tauri.conf.json` sets
      # `beforeBuildCommand: pnpm -C ../ui build`, which needs `ui/node_modules`, and the script
      # invokes `pnpm exec tauri`, which needs `mobile/node_modules`. Both exist on the machine
      # where this was written and on no runner anywhere.
      - name: the frontend
        run: |
          pixi run -e android pnpm -C ui install --frozen-lockfile
          pixi run -e android pnpm -C mobile install --frozen-lockfile
      - name: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}"    >> "$GITHUB_ENV"
          echo "FM_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: build the apk, unsigned
        run: FM_ANDROID_STAGE=build pixi run -e android android-release
      # **Renamed on the way out, and that is a safety property rather than tidiness.** `attach`
      # merges every artifact of the run into one directory; if this file kept its release name it
      # would collide with the signed one and could be published in its place. `unsigned-` is what
      # `attach` deletes before publishing, and `ci/checks.sh` asserts that it does.
      - name: set it aside as an intermediate
        shell: bash
        run: |
          set -euo pipefail
          cp "mobile/formicaria-${VERSION}-android-arm64.apk" unsigned-android-arm64.apk
          ls -la unsigned-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          if-no-files-found: error
          path: unsigned-android-arm64.apk

  android-sign:
    name: android apk (sign)
    runs-on: ubuntu-latest
    needs: android-build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.2
          environments: >-
            default
            android
          run-install: true
          cache: true
      # **No `rust-cache` here, and no compiler will run.** This job needs `apksigner`, which lives
      # in the pinned build-tools, so it restores the same toolchain cache; `android-init` prints
      # "already present" on a hit and re-fetches nothing.
      - name: cache the android toolchain
        uses: actions/cache@v6
        with:
          path: .android
          key: android-toolchain-${{ hashFiles('android/toolchain.lock') }}
      - name: the android toolchain
        run: pixi run android-init
      - name: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}"    >> "$GITHUB_ENV"
          echo "FM_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned
      - name: put it back under its release name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile
          mv unsigned-android-arm64.apk "mobile/formicaria-${VERSION}-android-arm64.apk"
      # ---------------------------------------------------------------------------------------
      # **The signing key, and how it is handled.** Three rules, copied from where the field gets
      # it right and avoiding where it gets it wrong (`decisions.md`, 2026-09-09):
      #
      #   1. **Through `env:`, never `${{ secrets.X }}` inside the script.** An inline expansion is
      #      substituted into the shell text before it runs. Syncthing-Android does this; Molly
      #      deliberately does not. `ci/checks.sh` now refuses it repo-wide.
      #   2. **Nothing into `$GITHUB_ENV`.** AnkiDroid writes its passwords there, which hands them
      #      to every later step and every action in the job.
      #   3. **Cleanup with `if: always()`.** Syncthing removes its keystore *after* gradle inside a
      #      `set -e` block, so a failed build leaves the key on the runner.
      # ---------------------------------------------------------------------------------------
      - name: the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "no ANDROID_KEYSTORE_B64 secret — nothing can sign this, so there is no APK to" >&2
            echo "publish. Add the four ANDROID_* secrets, or accept a release without it." >&2
            exit 1
          fi
          d="$HOME/.config/formicaria"
          mkdir -p "$d" && chmod 700 "$d"
          printenv KEYSTORE_B64 | base64 -d > "$d/android-release.keystore"
          chmod 600 "$d/android-release.keystore"
          umask 177
          {
            echo "storeFile=$d/android-release.keystore"
            echo "storePassword=$(printenv STORE_PASSWORD)"
            echo "keyAlias=$(printenv KEY_ALIAS)"
            echo "keyPassword=$(printenv KEY_PASSWORD)"
          } > "$d/android-release.properties"
      - name: sign it
        run: FM_ANDROID_STAGE=sign pixi run -e android android-release
      # **Cannot be skipped by a failure**, which is the whole point of `if: always()` here.
      - name: shred the signing key
        if: always()
        shell: bash
        run: |
          d="$HOME/.config/formicaria"
          shred -u "$d/android-release.keystore" "$d/android-release.properties" 2>/dev/null || \
            rm -f "$d/android-release.keystore" "$d/android-release.properties"
          ls -la "$d" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: mobile/formicaria-*-android-*.apk


  # **The signed release manifest** (`decisions.md#toolchain`, 2026-09-11) — the updater's trust root.
  #
  # Two jobs, split for the reason `android-build` and `android-sign` are: **the job holding the key
  # sees one small JSON file and runs one audited binary.** `manifest` downloads every artifact and
  # hashes it, with no secret; `manifest-sign` receives only that file, decodes the key, runs
  # `openssl` and shreds the key. No toolchain is installed there, because every program that runs on
  # a machine holding a key is a program that can read it.
  #
  # Both are `continue-on-error`, like the phone builds, and for the same reason: a signing failure must
  # not cost anyone the release. What it costs instead is safe — a release with no signature is one no
  # installed formicaria will accept as an update, and people can still download it by hand.
  manifest:
    name: release manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, ios, android-sign]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: the manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/unsigned-*
          sh ci/release-manifest.sh dist "${GITHUB_REF_NAME}"
          cat "dist/formicaria-${GITHUB_REF_NAME}.manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist/formicaria-${{ github.ref_name }}.manifest.json
          if-no-files-found: error

  manifest-sign:
    name: release manifest (sign)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: manifest
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Checked out for two small shell scripts and the list of trusted keys. Nothing is built.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: manifest
      - name: the signing key
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY_B64:-}" ]; then
            echo "no RELEASE_SIGNING_KEY_B64 secret — this release publishes without a signature, and no" >&2
            echo "installed formicaria will accept it as an update. See ci/release-key.sh." >&2
            exit 1
          fi
          d="$HOME/.config/formicaria"
          mkdir -p "$d" && chmod 700 "$d"
          umask 177
          printenv RELEASE_SIGNING_KEY_B64 | base64 -d > "$d/release-signing.pem"
      - name: sign it
        shell: bash
        run: |
          set -euo pipefail
          m="manifest/formicaria-${GITHUB_REF_NAME}.manifest.json"
          FM_RELEASE_KEY="$HOME/.config/formicaria/release-signing.pem" sh ci/release-sign.sh "$m"
          # **A signature from a key the app does not trust is a release nobody can take.** Checked
          # here so it is a red job on the tag, not a silent refusal on every device afterwards.
          pub=$(openssl pkey -in "$HOME/.config/formicaria/release-signing.pem" -pubout -outform DER \
                | tail -c 32 | od -An -tx1 | tr -d ' \n')
          if ! grep -Eiq "^${pub}([[:space:]]|$)" crates/fm-update/release-keys.txt; then
            echo "the signing key's public half ($pub) is not in crates/fm-update/release-keys.txt," >&2
            echo "so no installed formicaria would accept this release. Add it and tag again." >&2
            exit 1
          fi
      - name: shred the signing key
        if: always()
        shell: bash
        run: |
          f="$HOME/.config/formicaria/release-signing.pem"
          shred -u "$f" 2>/dev/null || rm -f "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-signature
          path: manifest/formicaria-${{ github.ref_name }}.manifest.json.sig
          if-no-files-found: error

  attach:
    name: attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    # **`binaries` gates; the phone legs do not.** They are `continue-on-error`, so a failed phone
    # build reports success to this job and simply contributes no artifact. A failed *desktop*
    # build still stops the release, which is the one thing that must not be published half-made.
    needs: [binaries, ios, android-sign, manifest, manifest-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # **The tag carries this release's own words.** `body:` below is the same every time — it has
      # to be, because it is the install instructions — and `generate_release_notes` is a list of
      # commit titles. Neither says what *this* version is. The annotation of an annotated tag is
      # where that belongs: authored per release, versioned in git, and impossible to forget,
      # because writing it is part of cutting the tag.
      #
      # `fetch-depth: 0` because a shallow checkout has no tag objects, and `%(contents)` reads the
      # annotation. A lightweight tag has none, and then this is empty and the body is what it
      # always was — so an unannotated tag degrades to the old behaviour rather than failing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # **The fingerprint comes from the file, never a copy.** `android/signing-certificate.sha256`
      # is the one place it is written; `ci/android-release.sh` refuses to ship an APK that does not
      # match it, and this reads the same file so the release page cannot drift from either.
      - id: cert
        run: |
          echo "sha256=$(sed -n 's/^sha256[[:space:]]*//p' android/signing-certificate.sha256 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # **Fetch the tag OBJECT, because the checkout did not** (fixed 2026-09-10).
          # `actions/checkout` fetches `+<commit-sha>:refs/tags/<tag>` — the commit, not the tag —
          # so the local tag is **lightweight**, and `%(contents)` on a lightweight tag returns the
          # commit's message. Every release from v0.3.0 to v0.5.1 therefore published the
          # `chore(release):` commit message, Co-Authored-By trailers and all, in place of the
          # notes that had been written for it. `fetch-depth: 0` does not help: it deepens history,
          # it does not turn a lightweight tag into an annotated one.
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" != tag ]; then
            # **Nothing, rather than the commit message.** An unannotated tag now degrades to the
            # static instructions alone — which is a release page missing its "what's new", and
            # obviously so. The old behaviour was to print a developer commit message at users and
            # look deliberate, which is how this went unnoticed for five releases.
            echo "::warning::$TAG is not an annotated tag — the release will carry no notes."
            echo 'text=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'text<<RELEASE_NOTES_EOF'
            git tag -l --format='%(contents)' "$TAG"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # **The unsigned intermediate is deleted before anything is published.** `merge-multiple`
      # pulls in every artifact of the run, including the one `android-build` hands to
      # `android-sign`. An unsigned APK on a release page would install for nobody and update
      # nothing, and would sit there looking official. `ci/checks.sh` asserts this step exists.
      - name: drop the intermediates
        run: |
          rm -f dist/unsigned-*
          ls -la dist
      # **The one screen every single downloader sees, and it was a list of commit titles.**
      #
      # Everything we have written about installing formicaria lives *inside* the archive — the
      # README, the manual, the per-OS setup pages. A user meets their browser's warning and their
      # OS's warning **before** they can open any of it, so on the near side of the download our
      # documentation is unreachable by construction. This body is the only place words reach them
      # at that moment. `generate_release_notes` still appends the changelog underneath.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **formicaria** is a notebook for research and writing. Your notes are ordinary Markdown
            files on your own computer — no account, no cloud, nothing sent anywhere. Nothing is
            installed: you unpack a folder and double-click.

            ${{ steps.notes.outputs.text }}

            ### Get started

            | Your system | Download | Then |
            |---|---|---|
            | Windows 10/11 (64-bit) | `…-windows-x86_64.zip` | double-click `Start formicaria.vbs` |
            | Mac, Apple silicon | `…-macos-arm64.tar.gz` | double-click `Start formicaria.command` |
            | Linux, x86-64 | `…-linux-x86_64.tar.gz` | double-click `Start formicaria.sh` |
            | Android phone or tablet | `…-android-arm64.apk` | open it on the device and allow the install |
            | iPhone or iPad | `…-ios-arm64.ipa` | sign it with your own free Apple ID — [how](https://github.com/formicaria-org/formicaria/blob/main/docs/src/user/iphone.md) |

            **Unpack it first** — do not run it from inside the zip. Windows opens zips in a
            temporary folder it later deletes, and it would take your notes with it.

            Your browser opens by itself: that is the app. Closing the tab stops it, and
            double-clicking the same file starts it again. Your notes stay in the `vault` folder
            beside it, so copying that folder to a USB stick takes them with you.

            ### Your computer will warn you the first time

            formicaria is free and open source, and we have not paid Microsoft or Apple to sign it.
            Both warn about the missing signature — not about anything found in the files.

            **Windows.** Your browser blocks the download first: click the three dots beside the
            message, then **Keep** → **Keep anyway**. Then Windows shows a blue *"Windows protected
            your PC"* box with no visible button — click the small grey **More info** text, then
            **Run anyway**.

            **macOS.** The first launch is refused, and the dialog offers only **Done** and **Move
            to Trash**.

            > ⚠️ **Do not click "Move to Trash".**

            Click **Done**, then  → **System Settings** → **Privacy & Security**, scroll to the
            bottom, and click **Open Anyway** beside the line about formicaria. Confirm with Touch
            ID, then double-click the launcher again and choose **Open**. Once only — after that a
            double-click just works. (Older guides say to right-click and choose Open; Apple removed
            that in macOS Sequoia.)

            **Linux.** No warning. If your file manager will not run it, mark it executable, or run
            `./Start\ formicaria.sh` from a terminal.

            ### Already using an earlier version?

            **Your notes are not in this download — they are still in the folder you have been
            using.** Every version is its own folder, and your notes live in the `vault` inside
            the one you already have. So this one starts empty, showing the same "Start here"
            note as a first install.

            Unpack this beside your existing folder, open the **new** folder and double-click
            **Update from an older folder** (`.bat` on Windows, `.command` on macOS, `.sh` on
            Linux). It finds the old folder, says what it is about to copy, and asks before it
            does anything. It only ever copies *into* the new folder — the old one is never
            written to and never deleted.

            **Do not delete the old folder until you have started this one and seen your notes
            in it.**

            ### What is in the folder

            `README.txt` and `Manual.html` — the whole manual, offline, also behind the **?** button
            in the app. `vault/` is your notes. `program/` is the application; you never need to
            open it.

            ### Good to know

            - **Backup and history need `git`** on Linux and macOS — Windows has it built in. The
              app works fully without it; you just have no history to step back through.
            - **Searching the text inside PDFs** needs `poppler`, and **encrypted media backup**
              needs `restic`. Settings tells you what this computer has.
            - **The phone apps are built by the same tag as the desktop ones**, so every download here
              is the same version. If one is missing, its build failed — the desktop apps are never
              held back for it.
            - **The iPhone app is not signed by us**, deliberately: you sign it with your own free
              Apple ID, which is what makes it free of the App Store. Apple's free signing lasts
              **seven days**, after which it needs refreshing — the linked page explains the tools
              that do that in the background.
            - **The Android app has no auto-update.** Check back here, or point
              [Obtainium](https://github.com/ImranR98/Obtainium) at this repository and let it watch
              for you.
            - **Checking the Android app is really ours.** Every formicaria APK is signed with the
              same certificate, and its fingerprint is

              ```text
              ${{ steps.cert.outputs.sha256 }}
              ```

              Read it back with `apksigner verify --print-certs <the file>`; the `SHA-256 digest`
              should match character for character. Android already stops anyone replacing an
              installed app with a differently-signed one — this is for the *first* install, where
              your phone has nothing to compare against yet.
