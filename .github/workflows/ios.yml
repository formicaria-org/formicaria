# iOS rung 1: **does it compile, and does a project generate at all?**
#
# Read `docs/context/ios-plan-2026-09-02.md` before firing this. The short version: there is no Mac
# and no iPhone, so a GitHub macOS runner is the only Mac this project has and the Simulator is the
# only device it will ever have. That makes every iOS question cost a job, and this is rung 1 of a
# ladder whose later rungs are not written yet — deliberately, because rung 1 may end the question.
#
# **Manual-only, and never on a tag.** `release.yml` is the single named exception to the
# no-remote-CI standing order (`decisions.md`, 2026-07-18) and fires unattended on every `v*`; an
# iOS leg there would widen that exception permanently, for a platform that cannot ship. See
# `decisions.md#track-m`, *an iOS build would contradict the project-local-toolchain ruling*.
#
# **Cost, stated before it is spent:** one `macos-latest` job, billed at 10x Linux. The estimate was
# $1.50-$3.00 and 25-45 minutes cold; **measured over three runs it is 2.8-7.7 min, ~$0.20-$0.60** —
# pessimistic by about 5x, which is worth knowing before calling a rung too expensive to try. Both
# steps run even if the first fails (`if: always()`), because the whole point is to learn as much as
# possible per job rather than to go green.
#
# **Kill criterion, written before the money is spent:** if two runs cannot produce a compile, and
# neither documented workaround for tauri#15066 takes, stop. Record "not until upstream moves" in
# `decisions.md` and close the question. Do not iterate this into a budget.
name: ios

# **One dispatch spends one job.** The rungs are a ladder with a stop-and-decide point between each
# step, and that is a cost control, so it belongs in the workflow rather than in remembering: pick
# the rung you are paying for and the other job does not start. Adding rung 2 as a second job with
# no switch would have doubled the bill of every dispatch, including the ones that only wanted a
# rung-1 re-run.
on:
  workflow_dispatch:
    inputs:
      rung:
        description: "Which rung to spend a job on"
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

# **Keyed by rung, not just by ref.** `cancel-in-progress` is right *within* a rung — a re-dispatch
# supersedes the previous attempt — but the two rungs are different experiments, and with a shared
# group, dispatching rung 2 while rung 1 was still running would cancel rung 1 mid-flight: minutes
# billed, artifact lost. `inputs` is available in `concurrency`.
concurrency:
  group: ios-${{ github.ref }}-${{ inputs.rung }}
  cancel-in-progress: true

jobs:
  rung1:
    if: inputs.rung == '1'
    name: does it compile, and does a project generate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # Both: `cross` carries the iOS rust-std targets (noarch, and the lock already solves them
          # for osx-arm64, which is what `macos-latest` is); `default` carries pnpm and the Tauri
          # CLI. A bare `pixi run --` uses `default`, so installing only `cross` would fail at the
          # first pnpm line.
          environments: >-
            default
            cross
          run-install: true
          cache: true
      # **Two non-default settings, both of which are cost.**
      #
      # `cache-on-failure` defaults to **false**, so a job that fails saves nothing — measured: the
      # two failed rung-2 runs (91349022694, 91351661719) have no `Post Run Swatinem/rust-cache`
      # step at all. Every retry therefore recompiled vendored OpenSSL, libgit2 and SQLite for the
      # iOS triples from scratch. For a rung expected to fail a few times while the *harness* is
      # debugged, that is exactly backwards: the compile is the expensive part and it is valid
      # regardless of whether the simulator later booted.
      #
      # `shared-key` replaces the automatic per-job key (`add-job-id-key` defaults to true), so
      # rung 1 and rung 2 share one cache instead of each keeping its own. Rung 1 spends ~3 minutes
      # per iOS triple building exactly the C that rung 2 needs; without this they never see each
      # other's work.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          shared-key: ios

      # ---- Question 1: the C wall. ----------------------------------------------------------
      # This is the one thing no amount of Linux work can answer. `fm-core --features native-git`
      # compiles vendored libgit2, vendored OpenSSL and SQLite from source for an Apple target, and
      # `openssl-src`'s iOS configuration is literally `xcrun -sdk iphoneos cc` — so it needs a real
      # Xcode and has never been attempted here.
      #
      # **`-ios-sim`, not `-ios`.** `macos-latest` is Apple silicon, so the Simulator runs the
      # `aarch64-apple-ios-sim` triple; the device triple is built too because it is nearly free
      # once the first one has warmed the cache, and because it is the one a real device would need.
      # Nothing in this repo can launch either — that is rung 2, and it does not exist yet.
      - name: fm-core for the Simulator triple
        id: sim
        run: pixi run -e cross cargo build --target aarch64-apple-ios-sim -p fm-core --features native-git

      - name: fm-core for the device triple
        if: always()
        run: pixi run -e cross cargo build --target aarch64-apple-ios -p fm-core --features native-git

      # `check-cross` already type-checks fm-agent for both iOS triples on Linux, for free. Repeat it
      # here so a divergence between "type-checks on Linux" and "compiles on a Mac" shows up in the
      # log rather than being assumed away.
      - name: the per-OS agent code, on a real Mac
        if: always()
        run: pixi run -e cross check-cross

      # ---- Question 2: does Tauri generate an iOS project at all? -----------------------------
      # `tauri ios init` writes `gen/apple/` — an XcodeGen project.yml, an .xcodeproj, a Podfile.
      # It has never run for this repo. The known hazard is tauri#15066: under Xcode 26 the link
      # step fails with `ld: library not found for -lswiftCompatibility56`. That bites `ios build`,
      # not necessarily `ios init`, and this rung deliberately stops at init — a build is rung 2.
      #
      # **`gen/apple` is never committed.** `.gitignore` already forbids the Android equivalent in
      # terms: it embeds absolute paths, so committing it would be committing this machine. It is
      # uploaded as an artifact instead, to be read rather than merged.
      # **Expected hazard, so the log is readable when it happens.** `tauri ios init` runs through
      # `cargo-mobile2`, which may try `rustup target add` — and this project has no rustup: rust
      # comes from pixi/conda, which is why the iOS targets are conda packages in `[feature.cross]`.
      # If it fails there, that is a *toolchain-shape* answer, not a "the port is impossible" answer,
      # and the fix is to point it at the already-installed targets rather than to install rustup.
      - name: tauri ios init
        if: always()
        working-directory: mobile
        run: |
          pixi run -- pnpm -C ../ui install --frozen-lockfile
          pixi run -- pnpm -C ../ui build
          pixi run -- pnpm install --frozen-lockfile
          pixi run -- pnpm exec tauri ios init --verbose

      - name: what was generated
        if: always()
        run: |
          echo "--- mobile/src-tauri/gen ---"
          ls -la mobile/src-tauri/gen 2>&1 || echo "(no gen/ at all)"
          echo "--- gen/apple ---"
          find mobile/src-tauri/gen/apple -maxdepth 2 2>&1 | head -50 || echo "(no gen/apple)"
          echo "--- toolchain ---"
          xcodebuild -version 2>&1 || true
          xcrun --sdk iphonesimulator --show-sdk-version 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-rung1
          path: |
            mobile/src-tauri/gen/apple
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================================
  # Rung 2: **does it boot?**
  #
  # Everything asserted here is in `ci/ios-smoke.sh`, not in this file — the same split
  # `android-smoke.sh` uses, and for the same reason: a test written as YAML steps cannot be read,
  # reasoned about or fixed anywhere except inside a billed run.
  #
  # **Kill criterion for this rung, written before the money is spent:** a blank screen *and* an
  # empty pty, after one `simctl spawn <udid> log stream` has been tried, ends the rung. Record
  # "the Simulator runs it but nothing can be observed" and stop; do not iterate this into a budget.
  #
  # Prerequisites cleared before this was written, each of which would have burned a job on its own:
  #   - `install_logger` has an iOS arm at all (there was no diagnostic channel on iOS until
  #     2026-09-03 — `decisions.md`, *the iOS diagnostic channel is stderr, not `os_log`*)
  #   - `ci/bin/rustup` is tracked, so Tauri's `rustup target add` finds our verifying shim on the
  #     runner. It lived in a gitignored directory and existed on exactly one machine
  #   - the shell compiles for iOS with default features at all — `build.rs` derives `agent_shell`
  #     from the feature **and** Android, so `src/agent.rs` (Android-only `native_lib_dir`) is not
  #     compiled into an iOS build
  # =========================================================================================
  # **Rungs 2 and 3 are one job**, because rung 3 *is* rung 2 plus a screenshot sweep over more
  # device sizes — and the sweep reuses the `.app` this job already built. The build is 360s of a
  # ~460s job, so a separate rung-3 job that rebuilt would cost more than every other rung together.
  rung2:
    if: inputs.rung == '2' || inputs.rung == '3'
    name: does it boot on a simulator (rung 3 also sweeps sizes)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # `default` carries pnpm, the Tauri CLI and libvips (the blank-screen check); `cross`
          # carries the iOS rust-std targets. Same pair rung 1 used.
          environments: >-
            default
            cross
          run-install: true
          cache: true
      # **Two non-default settings, both of which are cost.**
      #
      # `cache-on-failure` defaults to **false**, so a job that fails saves nothing — measured: the
      # two failed rung-2 runs (91349022694, 91351661719) have no `Post Run Swatinem/rust-cache`
      # step at all. Every retry therefore recompiled vendored OpenSSL, libgit2 and SQLite for the
      # iOS triples from scratch. For a rung expected to fail a few times while the *harness* is
      # debugged, that is exactly backwards: the compile is the expensive part and it is valid
      # regardless of whether the simulator later booted.
      #
      # `shared-key` replaces the automatic per-job key (`add-job-id-key` defaults to true), so
      # rung 1 and rung 2 share one cache instead of each keeping its own. Rung 1 spends ~3 minutes
      # per iOS triple building exactly the C that rung 2 needs; without this they never see each
      # other's work.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          shared-key: ios

      # The frontend must exist on disk before anything Rust runs: `generate_context!()` panics at
      # compile time if `frontendDist` (`../../ui/dist`) is missing. `tauri ios build` would run
      # `beforeBuildCommand` itself, but doing it here keeps the failure legible and separate.
      # **`-e cross` here too, so one environment does all of it.** The smoke step runs in `cross`
      # (it is the only environment with the iOS `rust-std` packages), and `node_modules` written by
      # one environment's pnpm and then used by another's is exactly what cost rung 2 its first job:
      # the two resolved different pnpm versions, the second re-resolved `@tauri-apps/cli` to the
      # darwin-x64 build, and the Tauri CLI ran under Rosetta 2 until `brew` refused it. The pins in
      # `[dependencies]` now make those versions equal — this keeps them the *same install*.
      - name: the frontend
        run: |
          pixi run -e cross pnpm -C ui install --frozen-lockfile
          pixi run -e cross pnpm -C ui build
          pixi run -e cross pnpm -C mobile install --frozen-lockfile

      # **`-e cross`, exactly as every Rust step in rung 1.** The iOS `rust-std` packages live in
      # `[feature.cross.dependencies]` and the `default` environment has *none* of them (measured:
      # zero `apple-ios` entries in its sysroot). A bare `pixi run ios-smoke` would take the default
      # env, `ci/bin/rustup` would correctly report the targets missing, and `tauri ios init` would
      # die there — after the checkout, the pixi install and the cache restore had all been paid for.
      #
      # `ci/ios-smoke.sh` puts `ci/bin` on PATH itself (the verifying `rustup` shim Tauri's mobile
      # commands need), so this step needs no environment beyond that.
      # `FM_IOS_SIZES` is empty for rung 2, so the sweep is inert and rung 2 behaves exactly as it
      # did when it was proven. Substrings, not identifiers — a device the runner image drops should
      # cost a skipped size and a note, not a failed job.
      #
      # **`iPhone-SE` was here and is deliberately gone.** The first rung-3 dispatch (2026-09-03)
      # ran 20+ minutes because of it: Xcode 26 still lists an `iPhone-SE-3rd-generation` *device
      # type*, so `simctl create` succeeded, but no installed iOS 26 runtime pairs with it and
      # `bootstatus -b` waited without a timeout. The script now resolves sizes against `simctl list
      # devices available` and bounds every boot, so this list would degrade to a fast skip — but
      # naming a device the image has not shipped since iOS 26 is asking for a skip, not a
      # screenshot. **The smallest and largest iPhones actually on the runner** are what the sweep
      # is for; re-read `simctl list devices available` in a job log before changing them.
      - name: boot it, twice
        run: pixi run -e cross ios-smoke
        env:
          FM_IOS_SIZES: ${{ inputs.rung == '3' && 'iPhone-17e iPhone-17-Pro-Max' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-rung${{ inputs.rung }}
          # The screenshots (including one per swept size), the pty transcripts, the deviation
          # numbers, the data-container tree and the before/after disk. On a failure this is the
          # whole observation.
          path: |
            target/ios-smoke
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================================
  # Rung 4: **does git work over HTTPS from iOS?**
  #
  # Deliberately dispatchable ahead of rung 3, because it is the single result that can end the
  # port. On Apple targets libgit2 links **SecureTransport**, not the vendored OpenSSL this project
  # builds, and `add_certs_from_pem` — the whole Android CA workaround — is `cfg`'d off there. The
  # iOS HTTPS path therefore rests on a claim nothing has ever executed.
  #
  # **The cheapest rung by a distance**: no pnpm, no frontend, no `tauri ios init`, no Homebrew, no
  # `xcodebuild`. Just cargo and one `simctl spawn`, against a warm shared cache.
  #
  # **Kill criterion:** the Simulator reaches github.com:443 and libgit2 still cannot talk to it →
  # stop. That is SecureTransport failing, the iPhone port cannot sync, and no distribution work
  # should be spent on it. The script prints which layer failed rather than "it did not work".
  rung4:
    if: inputs.rung == '4'
    name: does git work over https from ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: >-
            default
            cross
          run-install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          shared-key: ios

      # `-e cross` because that is the only environment carrying the iOS `rust-std` packages, and
      # the pins in `[dependencies]` keep its toolchain identical to `default`.
      - name: probe an https remote from the simulator
        run: pixi run -e cross ios-https-probe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-rung4
          # The cargo build log, the boot log, and the probe's own output — which on a failure is
          # the whole diagnosis.
          path: |
            target/ios-https-probe
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================================
  # Rung 5: **does a device-target unsigned IPA build?**
  #
  # **This rung was struck and is back.** `ios-plan-2026-09-02.md` said *"There is no rung 5 — a
  # device install would cost $99/yr to produce an artifact nobody can run"*, which was true under
  # the "no iPhone" ruling that has since been withdrawn. It now asks a different question than the
  # one it was struck for: not *"can we ship?"* but *"does the unsigned device path work?"* — see
  # `decisions.md`, *iOS ships as an unsigned IPA that each user signs with their own Apple ID*.
  #
  # **It costs no money beyond the job.** `--no-sign` makes tauri-cli take a `create_ipa()` path
  # that needs no team, no certificate and no provisioning profile
  # (`crates/tauri-cli/src/mobile/ios/build.rs:432-509`), so there is **no secret in this workflow**
  # and nothing to rotate. Everything asserted lives in `ci/ios-package.sh`, not here, for the same
  # reason rung 2's assertions do: YAML steps cannot be read, reasoned about or fixed anywhere
  # except inside a billed run.
  #
  # **Kill criterion, written before the money is spent:** if the archive fails asking for a signing
  # identity, team or profile, record "the unsigned device path needs a team after all" and stop.
  # Do not iterate this into a budget.
  #
  # **Order.** `decisions.md` binds rungs 4 and 3 ahead of this one — an unsyncable notes app is not
  # worth distributing. Rung 4 is green; dispatch rung 3 and read its screenshots before spending
  # this job.
  # =========================================================================================
  rung5:
    if: inputs.rung == '5'
    name: does a device-target unsigned ipa build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # Same pair as rungs 1 and 2: `default` carries pnpm and the Tauri CLI, `cross` carries
          # the iOS `rust-std` packages.
          environments: >-
            default
            cross
          run-install: true
          cache: true
      # `shared-key: ios` again — this is the *device* triple, which rung 1 already compiled
      # (2m47s) and nothing since has used. Without the shared key that work is bought twice.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
          shared-key: ios

      # Identical to rung 2's, and `-e cross` for the same measured reason: `node_modules` written
      # by one environment's pnpm and used by another's is what cost rung 2 its first job.
      - name: the frontend
        run: |
          pixi run -e cross pnpm -C ui install --frozen-lockfile
          pixi run -e cross pnpm -C ui build
          pixi run -e cross pnpm -C mobile install --frozen-lockfile

      - name: build and check the unsigned device ipa
        run: pixi run -e cross ios-package

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-rung5
          # **The `.ipa` itself, and the reasoning about it.** This is the first iOS artifact of
          # this project that is meant to leave CI — it is what a user would sideload. It is also
          # the first that has never run on the hardware it targets, which is why `stats.txt` and
          # the logs ship beside it rather than the binary alone.
          path: |
            mobile/src-tauri/gen/apple/build/arm64/*.ipa
            target/ios-package
          if-no-files-found: warn
          retention-days: 7
