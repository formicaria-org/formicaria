# The iPhone app, built unsigned for a device: one file, used two ways.
#
# - **By `release.yml`, on a `v*` tag** (`workflow_call`). The release has no copy of this job; it
#   calls this file, so the `.ipa` built by hand and the one that is published are made by the same
#   steps. (`android.yml` and `desktop.yml` are the same arrangement.)
# - **By hand** (`workflow_dispatch`): "does the iPhone app still build from this commit?" — the
#   question a new Xcode on `macos-latest` raises without notice. On a branch it is `dev-<commit>`.
#
# **It publishes nothing, either way.** It ends in the `ios-ipa` artifact. Publishing is
# `release.yml`'s `attach` job, and only on a tag.
#
# **There is no secret here and nothing to rotate.** The archive is made unsigned for a device
# target, which needs no team, no certificate and no provisioning profile; the person who installs
# it signs it with their own free Apple ID (`docs/src/user/iphone.md`). Everything asserted about
# the artifact lives in `ci/ios-package.sh`, not in YAML, because a script can be read, reasoned
# about and fixed without spending a job.
#
# This was rung 5 of the ladder in `ios-ladder.yml` (the experiments that got iOS building at all:
# compile, generate a project, boot in the Simulator, reach a server). The ladder keeps the four
# rungs that are still experiments; the one that became a product lives here.
#
# **Never on a push** (`ci/checks.sh` refuses it): it runs on macOS, takes tens of minutes, and
# answers a situational question. It is not the gate.
name: ios

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Its own group, never `release-…`: a called workflow that shared its caller's group would cancel it.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **`continue-on-error`, and that is the design** (`decisions.md`, 2026-09-09, *every platform is
  # published by the tag*): a phone build can never cost the desktop release. This leg depends on
  # Apple's SDK, reachable only inside whatever Xcode `macos-latest` is today — the image moved to
  # macOS 26 on 2026-09-09 and broke this build the same afternoon. A job that calls a workflow
  # cannot carry the key, so it lives here, where `ci/checks.sh` reads it through the call. The cost
  # is that a failed run by hand shows amber rather than red: read the job, not the tick.
  ipa:
    name: iphone ipa
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # **Pinned, and this is the whole reason the cache ever hits.**
          # setup-pixi keys its cache on sha256(pixi.lock)+environments+**sha256(the pixi
          # binary)**+path+cwd, and passes NO restoreKeys - it is exact-match or a full
          # miss. Unpinned, every pixi release (roughly fortnightly) rotates that key for
          # every workflow here at once, so a manually-dispatched job almost never hits.
          pixi-version: v0.72.2
          # The pair every iOS job here uses: `default` carries pnpm and the Tauri CLI, `cross` carries
          # the iOS `rust-std` packages.
          environments: >-
            default
            cross
          run-install: true
          cache: true
      # `shared-key: ios`, shared with `ios-ladder.yml`: its first rung compiles this same *device*
      # triple, and without the shared key that work is bought twice.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            mobile/src-tauri -> target
          cache-on-failure: true
          shared-key: ios

      # `-e cross` for a measured reason: `node_modules` written by one environment's pnpm and used
      # by another's is what cost the ladder's second rung its first job.
      # **Cache pnpm's STORE, never node_modules** — the same pattern `cross.yml` documents, and it
      # was missing here entirely: every iOS dispatch re-fetched the whole JS dependency tree, two
      # or three `pnpm install`s per job, on a runner billed at 10x Linux.
      #
      # pnpm fills node_modules with symlinks into a content-addressable store elsewhere, so
      # caching node_modules restores dangling links and pnpm then reports "Already up to date"
      # and repairs nothing. The store is content-addressed, which is why `restore-keys` is safe:
      # a partial hit means pnpm fetches what is missing and links the rest.
      #
      # `-e cross`, because that is the environment every pnpm step in this workflow runs in and a
      # different environment can resolve a different pnpm with a different store path.
      - name: pnpm store path
        id: pnpm
        shell: bash
        run: echo "dir=$(pixi run -e cross pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/pnpm-lock.yaml', 'mobile/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: the frontend
        run: |
          pixi run -e cross pnpm -C ui install --frozen-lockfile
          pixi run -e cross pnpm -C ui build
          pixi run -e cross pnpm -C mobile install --frozen-lockfile

      # **The manual is built into the app** (`decisions.md` 2026-10-18): the shell's `build.rs`
      # embeds `docs/book`, and refuses to build a versioned app without it.
      - name: the manual
        run: pixi run -e cross docs

      # **The version the artifact reports about itself**, exactly as the desktop release workflow
      # and `ci/android-release.sh` do it. Nothing set this on the iOS path, so Settings said `dev`
      # while `CFBundleShortVersionString` came from `tauri.conf.json` — two halves of one build
      # disagreeing about what it is, which is the confusion the version display exists to end.
      # Dispatching on a tag names the tag; on a branch it stays `dev`, which is honest for a
      # build that is not a release.
      - name: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}"    >> "$GITHUB_ENV"
          echo "FM_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "building as FM_VERSION=${VERSION}"

      - name: build and check the unsigned device ipa
        run: pixi run -e cross ios-package
      # Named like the desktop archives, because it sits beside them on the release page.
      - name: name it for the release
        shell: bash
        run: |
          set -euo pipefail
          src=$(find mobile/src-tauri/gen/apple/build/arm64 -maxdepth 1 -name '*.ipa' -type f | head -1)
          [ -n "$src" ] || { echo "no .ipa produced" >&2; exit 1; }
          cp "$src" "formicaria-${VERSION}-ios-arm64.ipa"
          ls -la formicaria-*.ipa
      # **Safe to publish because `ci/ios-package.sh` fails the job otherwise**: device platform,
      # a single `arm64` slice, no `_CodeSignature`, no entitlement a free personal team cannot
      # hold, the four `NS*UsageDescription` keys, and a `Payload/` layout a sideloader accepts.
      # An `.ipa` that exists here is one that passed all of them.
      - uses: actions/upload-artifact@v6
        with:
          name: ios-ipa
          if-no-files-found: error
          path: formicaria-*.ipa
