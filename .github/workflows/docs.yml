# The manual, built only when the manual changes.
#
# `docs/src/**` is the mdBook; a broken link there fails the build, which is worth knowing.
# Nothing else here is: README.md, docs/context/** (maintainer notes) and docs/assets/**
# are not part of the book, so they trigger nothing at all. Testing lives in ci.yml and is
# code-only — a redrawn image should never run a Rust test.
name: docs

# Manual-only by owner's standing order (2026-07-18): no remote CI billing until re-enabled.
# Restore by putting back below `workflow_dispatch:`:
#   push:
#     paths: &docs ['docs/src/**', 'docs/book.toml', '.github/workflows/docs.yml']
#   pull_request:
#     paths: *docs
on:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # **Pinned, and this is the whole reason the cache ever hits.**
          # setup-pixi keys its cache on sha256(pixi.lock)+environments+**sha256(the pixi
          # binary)**+path+cwd, and passes NO restoreKeys - it is exact-match or a full
          # miss. Unpinned, every pixi release (roughly fortnightly) rotates that key for
          # every workflow here at once, so a manually-dispatched job almost never hits.
          pixi-version: v0.72.2
          run-install: true
          cache: true
      - run: pixi run docs
