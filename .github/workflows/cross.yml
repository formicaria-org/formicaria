# macOS + Windows: the "everyone can use it" gate, and the release binaries.
#
# Split from `ci.yml` and **path-filtered on purpose**. The split was made when this was a
# private repo billing minutes at Linux 1x / Windows 2x / **macOS 10x** — 12x on a docs-only
# commit, which this repo makes constantly (`docs/context/` is the working memory) for a change
# that cannot break a compile. **On a public repo those minutes are free**, so the filter now
# exists for wall-clock and signal, not cost: fire it when something that could actually differ
# per-platform moves.
#
# **A second reason to fire it, since 2026-09-02.** The study assistant now runs on macOS and
# Windows, and its per-OS memory readings were written on a Linux machine that cannot compile them.
# `pixi run -e cross check-cross` type-checks them locally and for free; only this workflow *runs*
# them. Until it has, "the assistant works on macOS" is an inference, not an observation.
#
# Not a soft target, and it has already paid for itself: the first Windows run found that
# `from_file` was LF-only, so on a CRLF checkout every note failed to parse — and because
# the loader is deliberately tolerant they didn't error, they vanished, and the vault came
# up empty. Linux could never have shown that. (The `.md` merge driver, which everyone
# expected to be the Windows casualty, passes there untouched.)
name: cross

# **Currently manual-only.** That was a cost decision (2026-07-17: *"this month's minutes are
# spent, and at 10x/2x this workflow is essentially the whole bill"*) and the cost is gone — see
# `decisions.md`, *the repo goes public, and the economics every CI ruling rested on invert*
# (2026-09-04). The trigger is still off only because the visibility flip is the owner's to make
# by hand, and restoring it while the repo is private bills immediately.
#
# **Fire this by hand before a release** (Actions -> cross -> Run workflow) until then. Note that
# `release.yml` builds macOS/Windows on a `v*` tag regardless, so a tagged release exercises them
# either way.
#
# **SAFE TO UNCOMMENT ONCE THE REPO IS PUBLIC.** Put back below `workflow_dispatch:` —
#   push:
#     paths: ['crates/**', 'ui/**', 'ci/**', 'Cargo.toml', 'Cargo.lock', 'pixi.toml',
#             'pixi.lock', '.gitattributes', '.github/workflows/cross.yml']
#   pull_request:
#     paths: ['crates/**', 'ui/**', 'ci/**', 'Cargo.*', 'pixi.*']
#
# **Read the `scope` note on the job steps before you do.** `scope` is a `workflow_dispatch`
# input, so on a `push` it is empty — and every condition here had to be rewritten to survive
# that. Restoring the trigger without those fixes gave a green run that had skipped the gate.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full = the whole gate; agent = only the assistant''s per-OS code'
        type: choice
        default: agent
        options: [agent, full]
        required: false

# This workflow compiles and tests. It reads the tree and writes nothing back.
permissions:
  contents: read

concurrency:
  group: cross-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast: the point is to learn *which* platform is broken, and cancelling
      # the others the moment one goes red hides exactly that.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # **Pinned, and this is the whole reason the cache ever hits.**
          # setup-pixi keys its cache on sha256(pixi.lock)+environments+**sha256(the pixi
          # binary)**+path+cwd, and passes NO restoreKeys - it is exact-match or a full
          # miss. Unpinned, every pixi release (roughly fortnightly) rotates that key for
          # every workflow here at once, so a manually-dispatched job almost never hits.
          pixi-version: v0.72.2
          run-install: true
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      # Cache pnpm's STORE, never node_modules. pnpm fills node_modules with symlinks
      # into a content-addressable store that lives elsewhere, so restoring node_modules
      # alone restores dangling links — and pnpm then sees node_modules plus a matching
      # lockfile, reports "Already up to date", repairs nothing, and vitest dies on a
      # package that is a broken symlink. (It did exactly that on Windows.) The store is
      # content-addressed, so restore-keys are safe here: a partial hit just means pnpm
      # fetches what's missing and links the rest.
      # **`inputs.scope` IS EMPTY ON A PUSH**, and that is why these conditions are shaped the
      # way they are rather than the obvious way. `scope` is a `workflow_dispatch` input; on any
      # other event the whole `inputs` context is empty, so a plain `inputs.scope == 'full'`
      # evaluates **false** on a pushed run. Every expensive step would be skipped, the gate would
      # not run, and the workflow would report **green**. The same class of failure as 2026-08-28's
      # `dev-<sha>` release names: disabling a trigger re-meanings the conditions that remain, and
      # restoring one does it again in reverse.
      #
      # So: a non-dispatch event is always `full` — there is no menu on a push, and the safe
      # default when nobody chose is the whole gate, not the cheap slice.
      - name: pnpm store path
        id: pnpm
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
        shell: bash
        run: echo "dir=$(pixi run pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      # **`full` is the historic behaviour; `agent` is the cheap question.**
      #
      # The whole gate installs pnpm, builds the UI, renders the docs and runs 500 UI tests — none
      # of which can differ per platform in the way the assistant's memory readings can. At 10x for
      # macOS that is a large bill for one answer. So the default scope compiles and tests only the
      # crates that carry per-OS code, which is minutes rather than tens of minutes, and `full`
      # stays available for a pre-release sweep where the CRLF class of bug matters.
      - name: full gate
        if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
        run: pixi run ci
      # The exact complement of the line above — written out rather than negated, because these
      # two must never both run and must never both skip. On a push the left conjunct is false, so
      # this one is skipped and `full gate` above takes the run.
      - name: the assistant's per-OS code
        if: github.event_name == 'workflow_dispatch' && inputs.scope != 'full'
        run: pixi run -- cargo test -p fm-agent -p fm-serve
      # **The point of firing this since 2026-09-02.** The study assistant's per-OS memory readings
      # — `GlobalMemoryStatusEx` on Windows, mach VM statistics on macOS — were written on a Linux
      # machine that cannot compile them, let alone run them. `pixi run ci` above already executes
      # the test; this repeats it with output so the run *shows the number this platform reported*
      # rather than a green tick. A misread struct field is a refusal or an absurd value here, on
      # the platform itself, in the log.
      - name: the assistant's memory reading, on this platform
        run: pixi run -- cargo test -p fm-serve the_memory_reading -- --nocapture
