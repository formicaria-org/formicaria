# The Android app, built and signed: one file, used two ways.
#
# - **By hand, to test on a phone before a release** (`workflow_dispatch`). The owner's rule since
#   v0.6.2 is that a build is tried on the phone before it is tagged, and that needs only this: the
#   full `release.yml` also builds three desktop archives and an iOS app nobody is about to install.
#   Run this on `main`, download the `android-apk` artifact, check its certificate, install by cable.
# - **By `release.yml`, on a `v*` tag** (`workflow_call`). The release does not have its own copy of
#   these jobs; it calls this file, so the build a phone was tested with and the build that is
#   published are made by the same steps.
#
# **It publishes nothing, either way.** It ends in an artifact. Publishing is `release.yml`'s
# `attach` job, and only on a tag.
#
# **It never fires on its own.** No `push`, no `pull_request`: a signing job that anyone's push
# could start is not something to have. `ci/checks.sh` refuses those triggers here.
name: android

on:
  # "I want this commit on my phone."
  workflow_dispatch:
  workflow_call:
    # Named one by one, and none required: a fork, or a run with no signing secrets, still builds
    # the unsigned APK and fails only the signing job, with a sentence saying why.
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

# Its own group, never `release-…`: a called workflow that shared its caller's group would cancel it.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===============================================================================================
  # **Android is two jobs, and the seam is the point.**
  #
  # Building this APK compiles the whole Rust workspace — hundreds of crates, each free to run a
  # `build.rs` — plus npm and a cmake cross-compile of whisper.cpp. If the keystore were on that
  # machine, any one of them could read it. That is the largest exposure in the signing story and
  # nothing about *how the secret is passed* touches it: the key is on disk because `apksigner`
  # needs it there.
  #
  # So `android-build` holds **no secret at all**, and `android-sign` runs `apksigner` and nothing
  # else, on a fresh runner. Hundreds of third-party build scripts able to read the key becomes one
  # Google-published binary — and a build script cannot leave something behind to wait for the key,
  # because the key never appears on that machine. (`decisions.md`, 2026-09-09.)
  # ===============================================================================================
  android-build:
    name: android apk (build)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.2
          environments: >-
            default
            android
          run-install: true
          cache: true
      # **Both workspaces.** The Android build compiles into `mobile/src-tauri/target`, not the root
      # one — caching only `. -> target` would cache the half this job does not use. `ios.yml` has
      # named both since it was written; this job was added later and did not.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            mobile/src-tauri -> target
          shared-key: android
          cache-on-failure: true
      # ~1 GB of NDK/SDK, verified against `android/toolchain.lock` — *"the checksum, not the URL,
      # is the assertion"*. **It also carries `.android/whisper-src`**, where
      # `ci/android-stage-whisper.sh` clones and cross-compiles whisper.cpp, so the cmake build is
      # restored with it rather than repeated — that is the slowest single step in this job.
      - name: cache the android toolchain
        uses: actions/cache@v6
        with:
          path: .android
          key: android-toolchain-${{ hashFiles('android/toolchain.lock') }}
      - name: the android toolchain
        run: pixi run android-init
      # **Cache pnpm's STORE, never node_modules** — the pattern `cross.yml` and `ios.yml` document:
      # pnpm fills `node_modules` with symlinks into a content-addressable store elsewhere, so
      # caching `node_modules` restores dangling links and pnpm then reports "Already up to date"
      # and repairs nothing. The store is content-addressed, which is why `restore-keys` is safe.
      - name: pnpm store path
        id: pnpm
        shell: bash
        run: echo "dir=$(pixi run -e android pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/pnpm-lock.yaml', 'mobile/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      # **Without this the job cannot build at all.** `tauri.conf.json` sets
      # `beforeBuildCommand: pnpm -C ../ui build`, which needs `ui/node_modules`, and the script
      # invokes `pnpm exec tauri`, which needs `mobile/node_modules`. Both exist on the machine
      # where this was written and on no runner anywhere.
      - name: the frontend
        run: |
          pixi run -e android pnpm -C ui install --frozen-lockfile
          pixi run -e android pnpm -C mobile install --frozen-lockfile
      - name: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}"    >> "$GITHUB_ENV"
          echo "FM_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: build the apk, unsigned
        run: FM_ANDROID_STAGE=build pixi run -e android android-release
      # **Renamed on the way out, and that is a safety property rather than tidiness.** `attach`
      # merges every artifact of the run into one directory; if this file kept its release name it
      # would collide with the signed one and could be published in its place. `unsigned-` is what
      # `attach` deletes before publishing, and `ci/checks.sh` asserts that it does.
      - name: set it aside as an intermediate
        shell: bash
        run: |
          set -euo pipefail
          cp "mobile/formicaria-${VERSION}-android-arm64.apk" unsigned-android-arm64.apk
          ls -la unsigned-android-arm64.apk
      - uses: actions/upload-artifact@v6
        with:
          name: android-unsigned
          if-no-files-found: error
          path: unsigned-android-arm64.apk

  android-sign:
    name: android apk (sign)
    runs-on: ubuntu-latest
    needs: android-build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.72.2
          environments: >-
            default
            android
          run-install: true
          cache: true
      # **No `rust-cache` here, and no compiler will run.** This job needs `apksigner`, which lives
      # in the pinned build-tools, so it restores the same toolchain cache; `android-init` prints
      # "already present" on a hit and re-fetches nothing.
      - name: cache the android toolchain
        uses: actions/cache@v6
        with:
          path: .android
          key: android-toolchain-${{ hashFiles('android/toolchain.lock') }}
      - name: the android toolchain
        run: pixi run android-init
      - name: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-$(git rev-parse --short HEAD)"
          echo "VERSION=${VERSION}"    >> "$GITHUB_ENV"
          echo "FM_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: android-unsigned
      - name: put it back under its release name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile
          mv unsigned-android-arm64.apk "mobile/formicaria-${VERSION}-android-arm64.apk"
      # ---------------------------------------------------------------------------------------
      # **The signing key, and how it is handled.** Three rules, copied from where the field gets
      # it right and avoiding where it gets it wrong (`decisions.md`, 2026-09-09):
      #
      #   1. **Through `env:`, never `${{ secrets.X }}` inside the script.** An inline expansion is
      #      substituted into the shell text before it runs. Syncthing-Android does this; Molly
      #      deliberately does not. `ci/checks.sh` now refuses it repo-wide.
      #   2. **Nothing into `$GITHUB_ENV`.** AnkiDroid writes its passwords there, which hands them
      #      to every later step and every action in the job.
      #   3. **Cleanup with `if: always()`.** Syncthing removes its keystore *after* gradle inside a
      #      `set -e` block, so a failed build leaves the key on the runner.
      # ---------------------------------------------------------------------------------------
      - name: the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "no ANDROID_KEYSTORE_B64 secret — nothing can sign this, so there is no APK to" >&2
            echo "publish. Add the four ANDROID_* secrets, or accept a release without it." >&2
            exit 1
          fi
          d="$HOME/.config/formicaria"
          mkdir -p "$d" && chmod 700 "$d"
          printenv KEYSTORE_B64 | base64 -d > "$d/android-release.keystore"
          chmod 600 "$d/android-release.keystore"
          umask 177
          {
            echo "storeFile=$d/android-release.keystore"
            echo "storePassword=$(printenv STORE_PASSWORD)"
            echo "keyAlias=$(printenv KEY_ALIAS)"
            echo "keyPassword=$(printenv KEY_PASSWORD)"
          } > "$d/android-release.properties"
      - name: sign it
        run: FM_ANDROID_STAGE=sign pixi run -e android android-release
      # **Cannot be skipped by a failure**, which is the whole point of `if: always()` here.
      - name: shred the signing key
        if: always()
        shell: bash
        run: |
          d="$HOME/.config/formicaria"
          shred -u "$d/android-release.keystore" "$d/android-release.properties" 2>/dev/null || \
            rm -f "$d/android-release.keystore" "$d/android-release.properties"
          ls -la "$d" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          if-no-files-found: error
          path: mobile/formicaria-*-android-*.apk
