# The gate, on Linux, for every push. Cheap and always-on.
#
# macOS and Windows live in `cross.yml`, which is path-filtered — this is a private repo,
# so minutes are billed and GitHub multiplies them: Linux 1x, Windows 2x, **macOS 10x**.
# Running all three on every push is a 13x multiplier, and a large share of this repo's
# commits touch only `docs/context/` (it is the project's working memory and is updated
# every session). Those cannot break a Windows build, so they must not pay for one.
name: ci

on:
  push:
  pull_request:

# Pushing twice in a minute shouldn't pay twice. Supersede the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Caches the solved env by pixi.lock — otherwise every run re-downloads and relinks
      # ~2.5 GB of conda packages.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: true
          cache: true

      # ~/.cargo + target/. rusqlite compiles bundled SQLite from C on every cold build,
      # which is the single slowest thing here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # `ci` = test (incl. the perf budget) + test-ui + deny (license gate) + checks
      # (seam + generic-renderer greps) + docs. All must pass.
      #
      # Deliberately NOT followed by `pixi run build`: that is a second, full, release-mode
      # compile of the same code, and nothing consumes the result on an ordinary push.
      # Release binaries are built once, on a tag, in `cross.yml`.
      - run: pixi run ci
