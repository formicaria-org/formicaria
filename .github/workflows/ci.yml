# The gate, on Linux. Cheap, and meant to be always-on.
#
# macOS and Windows live in `cross.yml`, which is path-filtered. That split was made when this
# was a private repo and minutes were billed at Linux 1x / Windows 2x / **macOS 10x** — a 13x
# multiplier on every push, most of which touch only `docs/context/` and cannot break a Windows
# build. **On a public repo, standard-runner minutes are free**, so the split survives for a
# smaller reason: wall-clock and noise, not money.
name: ci

# **Currently manual-only, and that is now a leftover rather than a policy.**
#
# The 2026-07-18 no-remote-CI standing order made every workflow here `workflow_dispatch:`-only
# because the repo was private and minutes were billed. That is superseded — see `decisions.md`,
# *the repo goes public, and the economics every CI ruling rested on invert* (2026-09-04). The
# triggers were left off in that pass on purpose: the flip is the owner's to perform by hand, and
# restoring a trigger while the repo is still private bills immediately.
#
# **SAFE TO UNCOMMENT ONCE THE REPO IS PUBLIC.** Paste back below `workflow_dispatch:`:
#   push:
#     paths: &code
#       - 'crates/**', 'ui/**', 'ci/**', 'Cargo.toml', 'Cargo.lock', 'pixi.toml',
#         'pixi.lock', 'deny.toml', '.gitattributes', '.github/workflows/ci.yml'
#   pull_request:
#     paths: *code
#
# **Keep `paths:` on `push` and leave `pull_request` unfiltered.** A path-filtered
# `pull_request` check that never runs stays *pending* forever, so if it is ever made a required
# check it blocks every PR that does not touch those paths — a merge queue deadlocked by a
# docs-only change. Filtering the push half costs nothing and has no such failure mode.
#
# Meanwhile `pixi run ci` LOCALLY is the gate. It is the same commands this workflow runs.
on:
  # **Restored 2026-09-10**, the transition the comment above was written for. The repo is public,
  # standard runners are free, and the owner asked for Dependabot's pull requests to be checked
  # automatically — *"this requires the PRs to work and not break anything… also for future PRs"*.
  #
  # `pull_request` and not `pull_request_target`: the former runs the contributor's code with a
  # read-only token and **no secrets**, which is what makes it safe to run on a fork's branch. This
  # workflow needs no secret, so it loses nothing by that.
  #
  # `push` is limited to `main` so a branch does not pay twice — its pull request already covers it
  # — while every merge still gets checked on the branch people actually download from.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# **Least privilege, declared rather than inherited.** With no `permissions:` block every job
# takes the repository default, which on a public repo is read but is a *setting* — one someone
# can widen without touching a workflow. This job needs to read the tree and nothing else.
permissions:
  contents: read

# Pushing twice in a minute shouldn't pay twice. Supersede the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Caches the solved env by pixi.lock — otherwise every run re-downloads and relinks
      # ~2.5 GB of conda packages.
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          # **Pinned, and this is the whole reason the cache ever hits.**
          # setup-pixi keys its cache on sha256(pixi.lock)+environments+**sha256(the pixi
          # binary)**+path+cwd, and passes NO restoreKeys - it is exact-match or a full
          # miss. Unpinned, every pixi release (roughly fortnightly) rotates that key for
          # every workflow here at once, so a manually-dispatched job almost never hits.
          pixi-version: v0.72.2
          run-install: true
          cache: true

      # ~/.cargo + target/. rusqlite compiles bundled SQLite from C on every cold build,
      # which is the single slowest thing here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      # Cache pnpm's STORE, never node_modules. pnpm fills node_modules with symlinks
      # into a content-addressable store that lives elsewhere, so restoring node_modules
      # alone restores dangling links — and pnpm then sees node_modules plus a matching
      # lockfile, reports "Already up to date", repairs nothing, and vitest dies on a
      # package that is a broken symlink. (It did exactly that on Windows.) The store is
      # content-addressed, so restore-keys are safe here: a partial hit just means pnpm
      # fetches what's missing and links the rest.
      - name: pnpm store path
        id: pnpm
        shell: bash
        run: echo "dir=$(pixi run pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # `ci` = test (incl. the perf budget) + test-ui + deny (license gate) + checks
      # (seam + generic-renderer greps) + docs. All must pass.
      #
      # Deliberately NOT followed by `pixi run build`: that is a second, full, release-mode
      # compile of the same code, and nothing consumes the result on an ordinary push.
      # Release binaries are built once, on a tag, in `release.yml`.
      - run: pixi run ci
