// formicaria's browser (this first line must be a comment) — `decisions.md` 2026-11-15 (evening).
//
// Run by Firefox at every start (`autoconfig.js` points here), with the browser's own privileges,
// before any window exists. **Kept small on purpose**: each hook below reaches into Firefox's window,
// which a new ESR major may move (one already did: CustomizableUI's module path), and
// `ci/browser-check.sh` exercises every one before a release. It never acts on anything a web page
// says: its only inputs are the person and formicaria's own address.
try {
  const g = Components.utils.getGlobalForObject(Services);
  const { setTimeout } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
  const kit = Services.dirsvc.get("GreD", Ci.nsIFile);
  kit.append("formicaria");

  // 1. Branding: formicaria's icons and older name strings over Firefox's (`chrome.manifest`). The
  //    modern name strings are swapped inside Firefox's package when the kit is applied.
  const manifest = kit.clone();
  manifest.append("chrome.manifest");
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);

  // 2. Defaults, not overrides (decision 4): the person's own changes in Firefox's settings win.
  //    The one locked line is what lets formicaria's own (unsigned) add-on install.
  lockPref("xpinstall.signatures.required", false);
  // Strict tracking protection is applied as the Privacy switch says (`applyPrivacy`), not as a
  // default: Firefox turns a category's protections on only when the category changes, so a default
  // "strict" left them at standard and Firefox showed "custom" (found 2026-11-19, `usability-check`).
  // **Secure first, never a wall** (2026-11-25): every page is tried over https and one with no
  // secure version opens over http, marked not secure — Firefox's own HTTPS-First. HTTPS-Only (a
  // warning page before every such site) only when the person turns *Always https* on.
  defaultPref("dom.security.https_only_mode", false);
  defaultPref("dom.security.https_first", true);
  defaultPref("dom.security.https_first_schemeless", true);
  defaultPref("privacy.globalprivacycontrol.enabled", true);
  defaultPref("cookiebanners.service.mode", 1);
  defaultPref("cookiebanners.service.mode.privateBrowsing", 1);
  defaultPref("browser.shell.checkDefaultBrowser", false);
  defaultPref("browser.aboutwelcome.enabled", false);
  // **Tabs: classic, on top, always in view** (owner, 2026-11-16: *"why are we avoiding classic tabs
  // … ideally the number of icons is minimal and everything is intuitive"*). Down the side only when
  // the person chooses it in formicaria's Settings (`browser.json`, beside this browser), and then
  // always shown, never behind a button. Scrolling over the tabs switches them; Ctrl+Tab shows the
  // recent ones as cards.
  const settings = (() => {
    try {
      const f = Services.dirsvc.get("GreD", Ci.nsIFile).parent;
      f.append("browser.json");
      if (!f.exists()) return {};
      const raw = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
      raw.init(f, -1, 0, 0);
      const text = Cc["@mozilla.org/intl/converter-input-stream;1"].createInstance(Ci.nsIConverterInputStream);
      text.init(raw, "UTF-8", 0, 0);
      let all = "";
      const part = {};
      while (text.readString(0xffffffff, part) !== 0) all += part.value;
      text.close();
      return JSON.parse(all);
    } catch (e) {
      return {};
    }
  })();
  const sideTabs = settings.side_tabs === true;
  // **Firefox's new sidebar only for tabs down the side** (2026-11-18): it is what vertical tabs need,
  // and while it is on Firefox puts its sidebar button back in the toolbar at every start
  // (`CustomizableUI`'s `sidebar.revamp` observer), which a warm `browser-check` found. ESR's default
  // (off) otherwise: one sidebar less in the window.
  defaultPref("sidebar.revamp", sideTabs);
  defaultPref("sidebar.verticalTabs", sideTabs);
  if (sideTabs) Services.prefs.setStringPref("sidebar.visibility", "always-show");
  defaultPref("toolkit.tabbox.switchByScrolling", true);
  defaultPref("browser.ctrlTab.sortByRecentlyUsed", true);
  defaultPref("browser.tabs.splitView.enabled", true);
  defaultPref("browser.tabs.unloadOnLowMemory", true);
  // Firefox's mascot and its "drag important tabs here" card above the tab list.
  defaultPref("sidebar.verticalTabs.dragToPinPromo.dismissed", true);

  // 3. formicaria's touches on the window.
  const sheet = kit.clone();
  sheet.append("formicaria.css");
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  sss.loadAndRegisterSheet(Services.io.newFileURI(sheet), sss.USER_SHEET);

  // 4. **formicaria uses the browser** (`decisions.md` 2026-11-17, *one server, many views*). Every
  //    feature and every note is a page of formicaria's server (`/f/…`), each in a tab of its own:
  //    Firefox's tabs, session, split view and add-ons do the rest. This script only places
  //    formicaria's ant at the start of the tab row, keeps the quick switch, and carries tabs from
  //    the panel years over to their pages. Nothing here acts on what a page says.
  const home = () => Services.prefs.getStringPref("browser.startup.homepage", "").split("|")[0];
  const server = () => /^(https?:\/\/127\.0\.0\.1:\d+)/.exec(home())?.[1] ?? "";
  const sys = () => Services.scriptSecurityManager.getSystemPrincipal();
  /** **A tab of the notes, not any tab of formicaria's** (2026-11-21: a session that ended on
   *  Settings alone came back as Settings alone on every start; the notes never opened, and closing
   *  Settings closed the last tab, which ends the program). Settings, Privacy, Save media and the new
   *  tab are formicaria's pages but not the notes. */
  const notesTab = (spec, s) =>
    !!s && spec.startsWith(s) && !/^\/f\/(settings|privacy|media|new)(?:[/?#]|$)/.test(spec.slice(s.length));
  /** The ant: formicaria's add-on's button, whose panel opens a feature, a note or the web. */
  const ANT = "browser_formicaria-org_github_io-browser-action";

  /** formicaria's older item addresses (the panel years' tabs) as their pages' (`route.ts`). */
  const pageOf = (item) => {
    const s = server();
    if (!s) return "";
    if (item.startsWith("note:")) return `${s}/f/note/${item.slice(5)}`;
    const v = item.startsWith("view:") ? item.slice(5) : item;
    if (v.startsWith("group:")) return `${s}/f/group/${encodeURIComponent(v.slice(6))}`;
    if (v.startsWith("saved:")) return `${s}/f/view/${encodeURIComponent(v.slice(6))}`;
    if (/^(agenda|board|timeline|discussions|collaboration)$/.test(v)) return `${s}/f/${v}`;
    return `${s}/f/home`;
  };
  /** A tab the panel years left (an empty tab carrying formicaria's item) becomes that item's page. */
  const LEAN = "formicaria-item";
  const carryOver = (win, t) => {
    try {
      const item = win.SessionStore.getCustomTabValue(t, LEAN);
      if (!item) return;
      win.SessionStore.deleteCustomTabValue(t, LEAN);
      const url = pageOf(item);
      if (!url) return;
      const gb = win.gBrowser;
      const fresh = gb.addTab(url, { triggeringPrincipal: sys(), index: t._tPos });
      if (gb.selectedTab === t) gb.selectedTab = fresh;
      gb.removeTab(t);
    } catch (e) {
      Components.utils.reportError(e);
    }
  };

  /** **The quick switch** (Alt+Shift+X): the tab chosen before this one, whatever it holds. */
  const swap = (win) => {
    const gb = win.gBrowser;
    const prev = win.formicariaPrevTab?.deref?.();
    if (prev && !prev.closing && prev !== gb.selectedTab && gb.tabs.includes(prev)) {
      gb.selectedTab = prev;
      return "tab";
    }
    return "none";
  };

  /** **After an update, restart by itself** (`decisions.md` 2026-11-17; the owner: *"I update it in
   *  the app and see nothing without closing and opening it again"*). Every 20 s the server's build is
   *  read; when it changes, the server is asked to start the browser again once it has closed (with the
   *  kit brought up to date, on the same tabs), and the browser quits. Only if the server agreed. */
  let buildWatched = false;
  let firstBuild = null;
  let restarting = false;
  const watchBuild = (win) => {
    if (buildWatched) return;
    buildWatched = true;
    win.setInterval(async () => {
      if (restarting || !server()) return;
      try {
        const r = await win.fetch(`${server()}/api/alive`, { cache: "no-store" });
        const build = (await r.json())?.build;
        if (!build) return;
        if (!firstBuild) {
          firstBuild = build;
          return;
        }
        if (build === firstBuild) return;
        restarting = true;
        const asked = await win.fetch(`${server()}/api/browser_relaunch`, {
          method: "POST",
          headers: { "X-Formicaria-Relaunch": "1" },
        });
        if (asked.status === 202) Services.startup.quit(Ci.nsIAppStartup.eAttemptQuit);
        else restarting = false;
      } catch (e) {
        /* the server restarting: asked again in 20 s */
      }
    }, 20000);
  };

  /** **This device's privacy switches** (`decisions.md` 2026-11-17; `privacy.rs`), mapped onto
   *  Firefox's own protections. Read every 5 s; applied when they changed (`v`). A switch at its
   *  default clears formicaria's value, so Firefox's default (set at the top of this file) shows. */
  const PRIVACY_DEFAULTS = {
    "cookiebanners.service.mode": 1,
    "cookiebanners.service.mode.privateBrowsing": 1,
    "privacy.globalprivacycontrol.enabled": true,
    "dom.security.https_only_mode": false,
  };
  const setPref = (k, v) => {
    if (PRIVACY_DEFAULTS[k] === v) return Services.prefs.clearUserPref(k);
    if (typeof v === "boolean") Services.prefs.setBoolPref(k, v);
    else if (typeof v === "number") Services.prefs.setIntPref(k, v);
    else Services.prefs.setStringPref(k, v);
  };
  const LOCAL = /^(127\.0\.0\.1|localhost|\[::1\])$/;
  /** This device's switches as last read (`watchPrivacy`), for what happens while the browser closes. */
  let lastPrivacy = null;
  const privateBrowsing = () =>
    ChromeUtils.importESModule("resource://gre/modules/PrivateBrowsingUtils.sys.mjs").PrivateBrowsingUtils;
  const sessionStore = () =>
    ChromeUtils.importESModule("resource:///modules/sessionstore/SessionStore.sys.mjs").SessionStore;
  /** **The fire button closes the web's tabs** (2026-11-28, as DuckDuckGo's): every tab that is not
   *  formicaria's own, in every window; a private window goes whole while an ordinary one is open. A
   *  window left with nothing gets Home. Then they are forgotten as closed tabs, so Ctrl+Shift+T does
   *  not bring them back. `quitting`: windows are left to close by themselves. How many went. */
  const closeWebTabs = (quitting = false) => {
    const s = server();
    if (!s) return 0;
    const ours = (t) => !!t.linkedBrowser?.currentURI?.spec.startsWith(`${s}/`);
    const PBU = privateBrowsing();
    const wins = [...Services.wm.getEnumerator("navigator:browser")];
    const ordinary = wins.filter((w) => !PBU.isWindowPrivate(w));
    let n = 0;
    for (const w of wins) {
      const gb = w.gBrowser;
      if (!gb) continue;
      if (PBU.isWindowPrivate(w) && ordinary.length && !quitting) {
        n += gb.tabs.length;
        w.close();
        continue;
      }
      const web = gb.tabs.filter((t) => !ours(t));
      if (!web.length) continue;
      if (web.length === gb.tabs.length) gb.selectedTab = gb.addTab(home(), { triggeringPrincipal: sys() });
      for (const t of web) {
        gb.removeTab(t, { animate: false, skipPermitUnload: true });
        n += 1;
      }
    }
    try {
      const SS = sessionStore();
      for (const w of Services.wm.getEnumerator("navigator:browser"))
        while (SS.getClosedTabCountForWindow(w) > 0) SS.forgetClosedTab(w, 0);
      while (SS.getClosedWindowCount() > 0) SS.forgetClosedWindow(0);
    } catch (e) {
      Components.utils.reportError(`formicaria.cfg: forgetting closed tabs: ${e}`);
    }
    return n;
  };
  /** The fire button: every site's cookies and stored data, the caches and the history, except
   *  formicaria's own server's (which keeps this device's choices) and the sites kept signed in
   *  (`fireproof`, 2026-11-28: a site is cleared whole, so one kept part keeps its site). */
  const forget = async (p = lastPrivacy) => {
    const kept = (p?.fireproof ?? []).map((k) => String(k).toLowerCase());
    const CD = Ci.nsIClearDataService;
    const sites = new Set();
    for (const c of Services.cookies.cookies) sites.add(c.rawHost);
    await new Promise((done) => {
      try {
        const req = Services.qms.listOrigins();
        req.callback = () => {
          for (const o of req.result ?? []) {
            try {
              sites.add(new URL(o.replace(/\^.*$/, "")).hostname);
            } catch (e) {}
          }
          done();
        };
      } catch (e) {
        done();
      }
    });
    const bases = new Set();
    for (const h of sites) {
      if (!h || LOCAL.test(h)) continue;
      try {
        bases.add(Services.eTLD.getBaseDomainFromHost(h));
      } catch (e) {
        bases.add(h);
      }
    }
    for (const b of bases) {
      if (kept.some((k) => k === b || k.endsWith(`.${b}`) || b.endsWith(`.${k}`))) continue;
      await new Promise((done) =>
        Services.clearData.deleteDataFromSite(b, {}, true, CD.CLEAR_COOKIES_AND_SITE_DATA, done),
      );
    }
    await new Promise((done) =>
      Services.clearData.deleteData(
        CD.CLEAR_HISTORY | CD.CLEAR_ALL_CACHES | (CD.CLEAR_SESSION_HISTORY ?? 0),
        done,
      ),
    );
  };
  /** The search service. Firefox 153 keeps it as a module (`SearchService.sys.mjs`), no longer a
   *  registered service this script's `Services` reaches; older ones had `Services.search`. */
  const searchService = () => {
    try {
      return ChromeUtils.importESModule("moz-src:///toolkit/components/search/SearchService.sys.mjs")
        .SearchService;
    } catch (e) {
      return Services.search;
    }
  };
  /** **Tracking parts of links Firefox strips too** (`privacy-plan-2026-11-19.md` 2.7): the plain
   *  names of the AdGuard/uBO *URL Tracking Protection* list (GPL-3.0; `$removeparam=<name>` with no
   *  site), 289 on 2026-11-19, and the `utm_*` in use, added to Firefox's own (`privacy.query_stripping.strip_list`). */
  const STRIP = [
    "__hsfp __hssc __hstc __io_lv _bdadid _bhlid _branch_match_id _branch_referrer _clde _cldee _gl",
    "_hsenc _hsmi _io_session_id _ly_c _ly_r _ope _openstat _sgm_action _sgm_campaign _sgm_pinned",
    "_sgm_source _sgm_term _zucks_suid action_object_map action_ref_map action_type_map adc_publisher",
    "adc_token adfrom adj_campaign adj_creative adj_label adjust_adgroup adjust_campaign",
    "adjust_creative adjust_referrer adjust_tracker adjust_tracker_limit admitad_uid adobe_mc_ref",
    "adobe_mc_sdid adsterra_clid adsterra_placement_id af_ad af_adset af_click_lookback",
    "af_force_deeplink af_xp aiad_clid analytics_context analytics_trace_id asgtbndr at_campaign",
    "at_campaign_type at_creation at_emailtype at_link at_link_id at_link_origin at_link_type",
    "at_medium at_ptr_name at_recipient_id at_recipient_list at_send_date awc bance_xuid bemobdata",
    "beyond_uzcvid beyond_uzmcvid bsft_aaid bsft_clkid bsft_eid bsft_ek bsft_mid bsft_uid btag cjdata",
    "cjevent cm_cr cm_me cstrackid cx_click cx_recsorder cx_recswidget dclid dpg_campaign dpg_content",
    "dpg_medium dpg_source ebisadid ebisother1 ebisother2 ebisother3 ebisother4 ebisother5 emcs_t",
    "eml-mediaplan eml-name eml-publisher ems_dl eurl external_click_id famad_xuid fb_action_ids",
    "fb_action_types fb_comment_id fb_ref fb_source fbadid fbclid ftag gad_campaignid gad_source",
    "gbraid gci gclid gclsrc gps_adid guccounter guce_referrer guce_referrer_sig hsa_acc hsa_ad",
    "hsa_cam hsa_grp hsa_kw hsa_la hsa_mt hsa_net hsa_ol hsa_src hsa_tgt hsa_ver hsctatracking iclid",
    "int_campaign int_content int_medium int_source int_term ir_adid ir_campaignid ir_partnerid irgwc",
    "is_retargeting itm_campaign itm_content itm_medium itm_source itm_term janet jmtyclid ldtag_cl",
    "line_uid link_source loclid lt_r maf mc_cid mc_eid mindbox-click-id mindbox-message-key mkt_tok",
    "ml_subscriber ml_subscriber_hash msclkid mt_adset mt_campaign mt_click_id mt_creative mt_link_id",
    "mt_medium mt_network mt_sub1 mt_sub2 mt_sub3 mt_sub4 mt_sub5 mtm_campaign mtm_cid mtm_content",
    "mtm_group mtm_keyword mtm_medium mtm_placement mtm_source nb_expid_meta nb_placement nx_source",
    "oly_anon_id oprtrack personaclick_input_query personaclick_search_query pjclid pk_campaign",
    "pk_medium pk_source pk_vid raneaid ranmid ransiteid rb_clickid recommended_by recommended_code",
    "rtkcid s_cid sms_click sms_source sms_uph spot_im_redirect_source srclt srsltid sscid taid",
    "tcsack tgclid ttclid tw_medium tw_profile_id tw_source twclid unicorn_click_id",
    "user_email_address usqp utm_ad utm_adgroup utm_adset utm_affiliate utm_brand utm_campaign_name",
    "utm_campaignid utm_channel utm_cid utm_compaign utm_creative utm_email utm_emailid utm_emcid",
    "utm_emmid utm_id utm_id_ utm_journey_id utm_keyword utm_lob utm_name utm_newsletterid utm_place",
    "utm_prid utm_product utm_pubreferrer utm_reader utm_referrer utm_roistat utm_serial utm_servlet",
    "utm_session utm_siteid utm_social utm_social-type utm_source_code utm_source_platform",
    "utm_supplier utm_swu utm_tag utm_umguk utm_userid utm_viz_id utm_wave uzcid vero_conv vero_id",
    "vs_campaign_id vsm_cid vsm_pid vsm_type wbraid wickedid winflncrtag wt_mc x-a-medium x-clickref",
    "x-source xtor yclid yj_r ymid ysclid",
    // The list removes every `utm_*` by a pattern, which Firefox's list cannot hold: the ones in use.
    "utm_source utm_medium utm_campaign utm_term utm_content utm_id utm_name utm_cid utm_reader",
    "utm_referrer utm_social utm_social-type utm_brand utm_place utm_pubreferrer utm_swu utm_viz_id",
  ].join(" ");
  const applyPrivacy = async (p, win) => {
    // **Firefox's strict protection, really on** (2026-11-19): a category's protections are set by
    // Firefox when the category changes (its `ContentBlockingPrefs`), so it is changed, not defaulted.
    const category = p.trackers ? "strict" : "standard";
    if (Services.prefs.getStringPref("browser.contentblocking.category", "") !== category)
      Services.prefs.setStringPref("browser.contentblocking.category", category);
    setPref("cookiebanners.service.mode", p.cookies ? 1 : 0);
    setPref("cookiebanners.service.mode.privateBrowsing", p.cookies ? 1 : 0);
    Services.prefs.setBoolPref("privacy.query_stripping.enabled", !!p.clean_links);
    Services.prefs.setBoolPref("privacy.query_stripping.enabled.pbmode", !!p.clean_links);
    setPref("privacy.globalprivacycontrol.enabled", !!p.gpc);
    setPref("dom.security.https_only_mode", !!p.https_always);
    Services.prefs.setStringPref("privacy.query_stripping.strip_list", p.clean_links ? STRIP : "");
    // **Encrypted lookups** (the owner, 2026-11-19: on by default, Quad9): Firefox's DNS over HTTPS
    // with the chosen resolver, the system's lookups only when it cannot be reached (mode 2); the
    // network's own (mode 5: off by choice). A server too old to offer resolvers leaves it alone.
    if (Array.isArray(p.resolvers)) {
      const r = p.resolvers.find((x) => x.key === (p.dns ?? "quad9"));
      if (r?.url) {
        Services.prefs.setStringPref("network.trr.uri", r.url);
        Services.prefs.setStringPref("network.trr.custom_uri", r.url);
        Services.prefs.setIntPref("network.trr.mode", 2);
      } else {
        Services.prefs.setIntPref("network.trr.mode", 5);
      }
    }
    // Sites with protections off: tracking protection and https-only both let them be.
    const was = JSON.parse(Services.prefs.getStringPref("formicaria.privacy.sites", "[]"));
    const now = p.sites_off ?? [];
    const principals = (site) =>
      ["https", "http"].map((s) =>
        Services.scriptSecurityManager.createContentPrincipalFromOrigin(`${s}://${site}`),
      );
    for (const site of was.filter((s) => !now.includes(s)))
      for (const pr of principals(site)) {
        Services.perms.removeFromPrincipal(pr, "trackingprotection");
        Services.perms.removeFromPrincipal(pr, "https-only-load-insecure");
      }
    for (const site of now)
      for (const pr of principals(site)) {
        Services.perms.addFromPrincipal(pr, "trackingprotection", Services.perms.ALLOW_ACTION);
        Services.perms.addFromPrincipal(pr, "https-only-load-insecure", Services.perms.ALLOW_ACTION);
      }
    Services.prefs.setStringPref("formicaria.privacy.sites", JSON.stringify(now));
    // The search engine: one of formicaria's private list (the policy adds the ones Firefox lacks).
    const name = (p.engines ?? []).find((e) => e.key === p.search)?.name;
    if (name && searchService()) {
      const search = searchService();
      await search.init();
      const e = search.getEngineByName(name);
      if (e && search.defaultEngine?.name !== name)
        await search.setDefault(e, Ci.nsISearchService.CHANGE_REASON_UNKNOWN);
    }
    // The switches' extensions are made so after the switches are recorded (`watchPrivacy`): a
    // download from addons.mozilla.org must not hold up the protections above (2026-11-19).
    // The fire button: forgotten once per press, never on the first reading.
    // **Forget when closing** (2026-11-28): the session kept for the next start holds no site's
    // cookies or form data (Firefox's own level 2), so a sign-in cannot come back with the tabs;
    // the rest is done as the browser closes (`watchClosing`).
    if (p.fire_on_close) Services.prefs.setIntPref("browser.sessionstore.privacy_level", 2);
    else Services.prefs.clearUserPref("browser.sessionstore.privacy_level");
    const seen = Services.prefs.getIntPref("formicaria.privacy.fired", -1);
    Services.prefs.setIntPref("formicaria.privacy.fired", p.fired ?? 0);
    if (seen >= 0 && (p.fired ?? 0) > seen) {
      closeWebTabs();
      await forget(p);
    }
  };
  /** **Forget when closing** (2026-11-28; DuckDuckGo's *clear on exit*): as the browser closes, the
   *  web's tabs go before the session is kept, then the web's data is forgotten while the profile is
   *  still open (the same shutdown step as Firefox's own clearing), honouring the sites kept signed
   *  in. A restart for an update is not a closing. A browser that died before it could forget does it
   *  at its next start (`formicaria.privacy.burnPending`). */
  let closingWatched = false;
  const watchClosing = () => {
    if (closingWatched) return;
    closingWatched = true;
    Services.obs.addObserver((subject, topic, data) => {
      if (!lastPrivacy?.fire_on_close || restarting || data === "restart") return;
      try {
        if (subject instanceof Ci.nsISupportsPRBool && subject.data) return;
        closeWebTabs(true);
      } catch (e) {
        Components.utils.reportError(`formicaria.cfg: forget when closing: ${e}`);
      }
    }, "quit-application-requested");
    try {
      const { PlacesUtils } = ChromeUtils.importESModule("resource://gre/modules/PlacesUtils.sys.mjs");
      PlacesUtils.history.shutdownClient.jsclient.addBlocker("formicaria: forget when closing", async () => {
        try {
          if (lastPrivacy?.fire_on_close && !restarting) await forget(lastPrivacy);
          Services.prefs.setBoolPref("formicaria.privacy.burnPending", false);
          Services.prefs.savePrefFile(null);
        } catch (e) {
          Components.utils.reportError(`formicaria.cfg: forget when closing: ${e}`);
        }
      });
    } catch (e) {
      Components.utils.reportError(`formicaria.cfg: forget when closing: ${e}`);
    }
  };
  let pendingChecked = false;
  /** Once per start: a closing that did not finish forgetting (the browser died) is done now. */
  const catchUpClosing = async (p) => {
    if (pendingChecked) return;
    pendingChecked = true;
    const was = Services.prefs.getBoolPref("formicaria.privacy.burnPending", false);
    Services.prefs.setBoolPref("formicaria.privacy.burnPending", !!p.fire_on_close);
    if (was && p.fire_on_close) {
      closeWebTabs();
      await forget(p);
    }
  };

  /** **🔥 in the tab row** (2026-11-28): one press away on every tab, as DuckDuckGo's. It asks first,
   *  in a small panel saying what goes and what stays; then the press is recorded with the server
   *  (so the phone's sheet counts it too) and done here at once. */
  const FIRE = "formicaria-fire";
  const fireNow = async (win) => {
    const s = server();
    if (!s) return;
    const r = await win.fetch(`${s}/api/set_privacy`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fire: true }),
    });
    const p = await r.json();
    if (typeof p?.fired !== "number") throw new Error("formicaria did not record the press");
    lastPrivacy = p;
    // The press is this one: the next reading of the switches does not forget again.
    Services.prefs.setIntPref("formicaria.privacy.fired", p.fired);
    closeWebTabs();
    await forget(p);
  };
  const askFire = () => {
    const win = Services.wm.getMostRecentWindow("navigator:browser");
    if (!win) return;
    const doc = win.document;
    let panel = doc.getElementById("formicaria-fire-panel");
    if (!panel) {
      panel = doc.createXULElement("panel");
      panel.id = "formicaria-fire-panel";
      panel.setAttribute("type", "arrow");
      panel.setAttribute("role", "dialog");
      panel.setAttribute("aria-label", "forget web data");
      const box = doc.createXULElement("vbox");
      box.setAttribute("style", "padding: 12px; max-width: 26em; gap: 10px;");
      const said = doc.createXULElement("description");
      said.id = "formicaria-fire-said";
      const row = doc.createXULElement("hbox");
      row.setAttribute("pack", "end");
      const no = doc.createXULElement("button");
      no.id = "formicaria-fire-no";
      no.setAttribute("label", "Keep them");
      const yes = doc.createXULElement("button");
      yes.id = "formicaria-fire-yes";
      yes.setAttribute("label", "Close and forget");
      yes.setAttribute("default", "true");
      row.append(no, yes);
      box.append(said, row);
      panel.append(box);
      (doc.getElementById("mainPopupSet") ?? doc.documentElement).append(panel);
      no.addEventListener("command", () => panel.hidePopup());
      yes.addEventListener("command", () => {
        panel.hidePopup();
        fireNow(win).catch((e) => Components.utils.reportError(`formicaria.cfg: 🔥: ${e}`));
      });
    }
    const s = server();
    let web = 0;
    for (const w of Services.wm.getEnumerator("navigator:browser"))
      for (const t of w.gBrowser?.tabs ?? []) if (!t.linkedBrowser?.currentURI?.spec.startsWith(`${s}/`)) web += 1;
    const kept = lastPrivacy?.fireproof ?? [];
    doc.getElementById("formicaria-fire-said").textContent =
      `Close the web’s tabs (${web}) and forget every site’s cookies, stored data, cache and history?` +
      (kept.length ? ` Kept signed in: ${kept.join(", ")}.` : "") +
      " formicaria’s own tabs, your notes and the files you kept stay.";
    const anchor = doc.getElementById(FIRE);
    panel.openPopup(anchor?.checkVisibility?.() ? anchor : null, "bottomright topright");
  };
  let fireMade = false;
  const makeFire = (CUI) => {
    if (fireMade) return;
    fireMade = true;
    CUI.createWidget({
      id: FIRE,
      type: "button",
      label: "Forget web data",
      tooltiptext: "Close the web’s tabs and forget their data (🔥)",
      defaultArea: CUI.AREA_TABSTRIP,
      onCommand: () => {
        try {
          askFire();
        } catch (err) {
          Components.utils.reportError(`formicaria.cfg: 🔥: ${err}`);
        }
      },
    });
    // Placed once, just before Settings; moved by the person, it stays where they put it.
    try {
      if (!Services.prefs.getBoolPref("formicaria.toolbar.fire", false) || !CUI.getPlacementOfWidget(FIRE)) {
        const at = CUI.getPlacementOfWidget(SETTINGS);
        CUI.addWidgetToArea(FIRE, CUI.AREA_TABSTRIP, at?.area === CUI.AREA_TABSTRIP ? at.position : undefined);
        Services.prefs.setBoolPref("formicaria.toolbar.fire", true);
      }
    } catch (e) {
      Components.utils.reportError(`formicaria.cfg: placing 🔥: ${e}`);
    }
  };
  // The fourth item: a second switch it also needs. Cookie pop-ups and tracking links are Firefox's
  // own work (above); *More sites* is formicaria's own add-on's (DuckDuckGo's cookie rules) and the
  // wider strip list, no extension (`privacy-plan-2026-11-19.md` 5.1).
  /** The privacy rules' own version: 3 since *More sites* installs no extension; 4 since strict
   *  protection is set by its category's change (it had stayed "custom"), so every browser applies
   *  its switches once more; 5 since *Forget when closing* sets the session's privacy level. */
  const RULES = 5;
  const PRIVACY_ADDONS = [
    ["ddg", "jid1-ZAdIEUB7XOzOJw@jetpack", "duckduckgo-for-firefox"],
    ["ads", "uBOLiteRedux@raymondhill.net", "ublock-origin-lite"],
  ];
  /** Extensions formicaria installed once and no longer does (Consent-O-Matic, ClearURLs, full uBlock
   *  Origin): removed
   *  if formicaria installed them; one the person added is theirs. */
  const RETIRED_ADDONS = [
    "gdpr@cavi.au.dk",
    "{74145f27-f039-47ce-a470-a662b129930a}",
    // Full uBlock Origin, in place of which *Block ads* now installs uBlock Origin Lite (+1–6 %
    // memory against +48 %, 2026-11-19). One the person installed themselves is kept.
    "uBlock0@raymondhill.net",
  ];
  const privacyAddons = async (p) => {
    const { AddonManager } = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
    const ours = new Set(JSON.parse(Services.prefs.getStringPref("formicaria.privacy.addons", "[]")));
    for (const [sw, id, slug, also] of PRIVACY_ADDONS) {
      try {
        const want = !!p[sw] && (!also || !!p[also]);
        const have = await AddonManager.getAddonByID(id);
        if (want && !have) {
          const url = `https://addons.mozilla.org/firefox/downloads/latest/${slug}/latest.xpi`;
          const install = await AddonManager.getInstallForURL(url, {
            telemetryInfo: { source: "enterprise-policy" },
          });
          // Its own tab, if it opens one, is closed (`keepToOurTabs`).
          ownTabsUntil = Math.max(ownTabsUntil, Date.now() + 60000);
          await install.install();
          ours.add(id);
        } else if (want && have && have.userDisabled) {
          await have.enable();
        } else if (
          !want &&
          have &&
          (ours.has(id) || have.installTelemetryInfo?.source === "enterprise-policy")
        ) {
          await have.uninstall();
          ours.delete(id);
        }
      } catch (e) {
        Components.utils.reportError(`formicaria.cfg: ${id}: ${e}`);
      }
    }
    for (const id of RETIRED_ADDONS) {
      try {
        const have = await AddonManager.getAddonByID(id);
        if (have && (ours.has(id) || have.installTelemetryInfo?.source === "enterprise-policy")) {
          await have.uninstall();
        }
        ours.delete(id);
      } catch (e) {
        Components.utils.reportError(`formicaria.cfg: ${id}: ${e}`);
      }
    }
    Services.prefs.setStringPref("formicaria.privacy.addons", JSON.stringify([...ours]));
  };
  /** **No tabs nobody asked for** (the owner on 0.50: *"I open and it opens two tabs, and I do not know
   *  why"*). For the first minutes, and after each switch installs an extension: a tab a privacy
   *  extension opens for itself (its options, a welcome page) is closed. And the browser started on
   *  the restored session alone (`browser.rs`'s `start_address`): if none of its tabs is formicaria's,
   *  the notes are opened. */
  let ownTabsUntil = Date.now() + 120000;
  /** **Once per start, in the first ordinary window** (2026-11-25: a site's sign-in window, and the
   *  download question's, gained a tab of formicaria's Home). It ran in every window, and a sign-in popup — a site's
   *  `window.open` with features, toolbars hidden — is a window: four seconds in, it had no notes tab,
   *  so Home was added and brought in front of the sign-in. A second window (Ctrl+N, a tab dragged
   *  out) is asked for too, and is left as it was asked for. */
  let notesLooked = false;
  // Firefox marks a window opened with features (a site's popup, an extension's `type: popup`) by
  // the toolbars it hides. Not `win.toolbar.visible`: from this script it reads as nothing, which
  // made every window a popup and the first start never opened the notes.
  const popupWindow = (win) =>
    /\b(toolbar|location)\b/.test(win.document.documentElement.getAttribute("chromehidden") ?? "");
  const keepToOurTabs = (win) => {
    const gb = win.gBrowser;
    const welcome = /^https:\/\/(www\.)?duckduckgo\.com\/(extension-success|install|onboarding)/;
    const sweep = () => {
      if (Date.now() > ownTabsUntil) return;
      const hosts = new Set(
        // `WebExtensionPolicy` is the window's, not this script's (as the search service is).
        PRIVACY_ADDONS.map(([, id]) => win.WebExtensionPolicy?.getByID(id)?.mozExtensionHostname).filter(Boolean),
      );
      for (const t of [...gb.tabs]) {
        const u = t.linkedBrowser?.currentURI;
        if (!u || gb.tabs.length < 2) continue;
        if ((u.scheme === "moz-extension" && hosts.has(u.host)) || welcome.test(u.spec)) gb.removeTab(t);
      }
    };
    win.setInterval(sweep, 1000);
    if (notesLooked || popupWindow(win)) return;
    notesLooked = true;
    win.setTimeout(() => {
      const s = server();
      if (!s || gb.tabs.some((t) => notesTab(t.linkedBrowser?.currentURI?.spec ?? "", s))) return;
      const notes = gb.addTab(home(), { triggeringPrincipal: sys() });
      gb.selectedTab = notes;
    }, 4000);
  };
  /** **A newer formicaria, offered above every tab** (2026-11-21, extending `decisions.md`'s *an
   *  update is one press, and the app offers it where people are*): the question the notes' line asks
   *  the server, every quarter of an hour, answered in the window's own bar, so a person on any page —
   *  Settings, a web page — sees it. Only where this copy can install it. *Update* brings a tab of the
   *  notes to the front and starts the one press there (`#update`), so open notes are saved first;
   *  *Later* waits three days for that version, as the notes' line does. */
  const LATER_MS = 3 * 24 * 60 * 60 * 1000;
  let updateWatched = false;
  const offerUpdate = (win) => {
    if (updateWatched) return;
    updateWatched = true;
    const gb = win.gBrowser;
    const press = () => {
      const s = server();
      if (!s) return;
      const t = gb.tabs.find((x) => notesTab(x.linkedBrowser?.currentURI?.spec ?? "", s));
      if (t) {
        gb.selectedTab = t;
        const base = t.linkedBrowser.currentURI.spec.split("#")[0];
        t.linkedBrowser.loadURI(Services.io.newURI(`${base}#update`), { triggeringPrincipal: sys() });
      } else {
        gb.selectedTab = gb.addTab(`${home().split("#")[0]}#update`, { triggeringPrincipal: sys() });
      }
    };
    const look = async () => {
      if (!server()) return;
      try {
        const r = await win.fetch(`${server()}/api/update_status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
          cache: "no-store",
        });
        await show(await r.json());
      } catch (e) {
        /* no server yet, or a build without the updater: asked again later */
      }
    };
    /** The bar for what the server said (`usability-check` hands it one directly). */
    const show = async (u) => {
        const box = win.gNotificationBox;
        const shown = box?.getNotificationWithValue("formicaria-update");
        if (!u?.available || !u.can_install || u.progress) {
          if (shown) box.removeNotification(shown);
          return;
        }
        let later = null;
        try {
          later = JSON.parse(Services.prefs.getStringPref("formicaria.update.later", "null"));
        } catch (e) {
          later = null;
        }
        if (later && later.version === u.available && Date.now() - later.at < LATER_MS) return;
        if (!box || shown) return;
        await box.appendNotification(
          "formicaria-update",
          {
            label: `formicaria ${u.available} is out — you have ${u.current ?? "an older version"}.`,
            priority: box.PRIORITY_INFO_HIGH,
          },
          [
            { label: "Update", accessKey: "U", callback: () => void press() },
            {
              label: "Later",
              accessKey: "L",
              callback: () =>
                void Services.prefs.setStringPref(
                  "formicaria.update.later",
                  JSON.stringify({ version: u.available, at: Date.now() }),
                ),
            },
          ],
        );
    };
    win.formicariaUpdateShow = show;
    win.setTimeout(look, 15000);
    win.setInterval(look, 15 * 60 * 1000);
  };
  let privacyWatched = false;
  const watchPrivacy = (win) => {
    if (privacyWatched) return;
    privacyWatched = true;
    let addonsChecked = false;
    let busy = false;
    const read = async () => {
      if (busy || !server()) return;
      busy = true;
      try {
        const r = await win.fetch(`${server()}/api/privacy`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
          cache: "no-store",
        });
        const p = await r.json();
        if (typeof p?.v === "number") {
          lastPrivacy = p;
          await catchUpClosing(p);
        }
        // Applied again, once, when this script's own rules change (`RULES`), not only when the
        // switches do: an update that maps a switch differently reaches a browser set up before it.
        if (
          typeof p?.v === "number" &&
          (p.v !== Services.prefs.getIntPref("formicaria.privacy.v", -1) ||
            Services.prefs.getIntPref("formicaria.privacy.rules", 0) < RULES)
        ) {
          await applyPrivacy(p, win);
          Services.prefs.setIntPref("formicaria.privacy.v", p.v);
          Services.prefs.setIntPref("formicaria.privacy.rules", RULES);
          // The switches' extensions (`browser.rs`'s `PRIVACY_ADDONS`): installed while on, from
          // addons.mozilla.org; removed when off, **only if formicaria installed them** — an
          // extension the person added themselves is theirs to keep. After the switches are
          // recorded, so a slow download holds up nothing else.
          addonsChecked = true;
          await privacyAddons(p);
        } else if (typeof p?.v === "number" && !addonsChecked) {
          // **Once per start, the extensions the switches want are made so** (2026-11-19): an
          // install cut short by the browser closing was never tried again, so *Block ads* could
          // stay on with nothing blocking. A look per extension; an install only if one is missing.
          addonsChecked = true;
          await privacyAddons(p);
        }
      } catch (e) {
        /* the server restarting: read again in 5 s */
      } finally {
        busy = false;
      }
    };
    void read();
    win.setInterval(read, 5000);
  };

  /** **Settings at the top right, on every tab** (owner, 2026-11-18: *"why not simply add settings on
   *  top right as per usual apps, like browsers do, why embed it only on one page?"*). The tab row is
   *  the one row every tab shows (the address row, with Firefox's ☰, goes on formicaria's pages), so
   *  formicaria's Settings is a button at its right end: one door, the same on a note, a view and a web
   *  page. It opens Settings in a tab, or goes to the one already open. */
  const SETTINGS = "formicaria-settings";
  const openSettings = () => {
    // **The window in front**, which is the one pressed: the press's event reaches this script without
    // its window (`ownerGlobal` does not cross into the sandbox; found by `usability-check`).
    const win = Services.wm.getMostRecentWindow("navigator:browser");
    if (!win) return;
    const s = server();
    if (!s) {
      Components.utils.reportError("formicaria.cfg: Settings: formicaria's address is not known yet");
      return;
    }
    const gb = win.gBrowser;
    const open = gb.tabs.find((t) => t.linkedBrowser?.currentURI?.spec.startsWith(`${s}/f/settings`));
    gb.selectedTab = open ?? gb.addTab(`${s}/f/settings`, { triggeringPrincipal: sys() });
  };
  let settingsMade = false;
  const makeSettings = (CUI) => {
    if (settingsMade) return;
    settingsMade = true;
    CUI.createWidget({
      id: SETTINGS,
      type: "button",
      label: "Settings",
      tooltiptext: "Settings: privacy, updates, mail for meetings, and more",
      defaultArea: CUI.AREA_TABSTRIP,
      // Its own error reported: Firefox's toolbar library logs a widget's failure only to its own
      // logger, so a dead button said nothing anywhere.
      onCommand: () => {
        try {
          openSettings();
        } catch (err) {
          Components.utils.reportError(`formicaria.cfg: Settings: ${err}`);
        }
      },
    });
    // **Never out of reach** (as the ant, the owner on 0.50: *"I don't see settings anymore"*): put
    // at the right end of the tab row once, and back there whenever it is in no toolbar at all. Moved
    // within the toolbars by the person, it stays where they put it.
    try {
      if (!Services.prefs.getBoolPref("formicaria.toolbar.settings", false) || !CUI.getPlacementOfWidget(SETTINGS)) {
        CUI.addWidgetToArea(SETTINGS, CUI.AREA_TABSTRIP);
        Services.prefs.setBoolPref("formicaria.toolbar.settings", true);
      }
    } catch (e) {
      Components.utils.reportError(`formicaria.cfg: placing Settings: ${e}`);
    }
  };

  /** ← and → at the start of a window's tab row, for formicaria's own pages (see where it is called). */
  const makeBackForward = (win) => {
    const doc = win.document;
    const items = doc.getElementById("TabsToolbar")?.querySelector(".toolbar-items");
    if (!items || doc.getElementById("formicaria-back")) return;
    for (const [id, label, command, tip] of [
      ["formicaria-back", "Back", "Browser:Back", "Back (Alt+←)"],
      ["formicaria-forward", "Forward", "Browser:Forward", "Forward (Alt+→)"],
    ]) {
      const b = doc.createXULElement("toolbarbutton");
      b.id = id;
      b.className = "toolbarbutton-1 chromeclass-toolbar-additional";
      b.setAttribute("label", label);
      b.setAttribute("tooltiptext", tip);
      b.setAttribute("command", command);
      items.before(b);
    }
  };

  /** **☆ and Ctrl+D make a bookmark note too** (see where it is called). Firefox's own bookmark is
   *  still made, so Sync goes on carrying it; formicaria's note is the page's title and link, tagged
   *  `shelf:Bookmarks`, the same note as the add-on's *Just the link instead* (`background.ts`,
   *  `bookmark`). Only for these gestures, never for bookmarks that arrive by Sync or an import. */
  const bookmarkNotes = (win) => {
    const hook = win.PlacesCommandHook;
    if (!hook || hook.formicariaNotes) return;
    hook.formicariaNotes = true;
    const call = async (s, route, args) => {
      const r = await win.fetch(`${s}/api/${route}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(args),
      });
      const text = await r.text();
      if (!r.ok) throw new Error(text || `formicaria answered ${r.status}`);
      return text ? JSON.parse(text) : null;
    };
    const today = () => {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    };
    /** The note for `url`: one already made from this page (saved or bookmarked: its source is
     *  the page), else a new bookmark note. `{ id, title, made }`. */
    const noteFor = async (s, url, title) => {
      const named = (await call(s, "page_notes", { url })) ?? [];
      const own = named.find((n) => String(n.context ?? "").startsWith("source_url:"));
      if (own) return { id: own.id, title: own.title, made: false };
      const made = await call(s, "clip_save", {
        url,
        title,
        body: `[${title.replace(/[[\]]/g, "")}](${url})\n\n---\n\nBookmarked on ${today()}.\n`,
        tags: ["web", "shelf:Bookmarks"],
        props: { source_url: url, saved: today() },
        bibtex: "",
        snapshot: "",
      });
      return { id: made?.id, title, made: true };
    };
    /** The press this panel is about: `{ url, note }`, `note` a promise of `noteFor`'s answer. */
    let last = null;
    const original = hook.bookmarkPage;
    hook.bookmarkPage = function (...args) {
      last = null;
      try {
        const s = server();
        const browser = win.gBrowser.selectedBrowser;
        const url = Services.io.createExposableURI(browser.currentURI).spec;
        if (s && /^https?:/.test(url) && !url.startsWith(`${s}/`)) {
          const title = (browser.contentTitle || url).trim();
          last = { url, note: noteFor(s, url, title) };
          last.note.catch((e) => Components.utils.reportError(`formicaria.cfg: ☆: ${e}`));
        }
      } catch (e) {
        Components.utils.reportError(`formicaria.cfg: ☆: ${e}`);
      }
      return original.apply(this, args);
    };
    // **Remove** in the panel takes back what this press made, the note with the bookmark.
    const star = win.StarUI;
    const remove = star?.removeBookmarkButtonCommand;
    if (star && remove) {
      star.removeBookmarkButtonCommand = function (...args) {
        const press = last;
        last = null;
        press?.note
          .then((n) => (n.made && n.id ? call(server(), "delete", { id: n.id }) : null))
          .catch(() => {});
        return remove.apply(this, args);
      };
    }
    // **The panel says where the note is**, with a link to open it in a tab.
    win.document.addEventListener(
      "popupshown",
      (e) => {
        if (e.target?.id !== "editBookmarkPanel") return;
        const doc = win.document;
        const box = doc.getElementById("editBookmarkPanelBottomContent");
        if (!box) return;
        let line = doc.getElementById("formicaria-bookmark-note");
        if (!line) {
          line = doc.createXULElement("hbox");
          line.id = "formicaria-bookmark-note";
          line.setAttribute("align", "center");
          const said = doc.createXULElement("label");
          const open = doc.createXULElement("label");
          open.className = "text-link";
          open.setAttribute("value", "Open the note");
          line.append(said, open);
          box.prepend(line);
        }
        const [said, open] = line.children;
        const press = last;
        line.hidden = !press;
        if (!press) return;
        said.setAttribute("value", "Saving it in formicaria as a note…");
        open.hidden = true;
        press.note.then(
          (n) => {
            if (last !== press) return;
            said.setAttribute(
              "value",
              n.made ? "Also saved in formicaria, as a note." : "Already in formicaria, as a note.",
            );
            open.hidden = !n.id;
            open.onclick = () => {
              const gb = win.gBrowser;
              gb.selectedTab = gb.addTab(`${server()}/f/note/${n.id}`, { triggeringPrincipal: sys() });
              e.target.hidePopup();
            };
          },
          () => {
            if (last !== press) return;
            said.setAttribute("value", "Not saved in formicaria: it did not answer.");
          },
        );
      },
      true,
    );
  };

  /** **The usage diary** (`fm_app::diary`, `decisions.md` 2026-11-20): the browser tells it its
   *  start (how long its session took to come back) and, when it quits, why — Firefox says
   *  "lastwindow" when the last window closing was the reason, as it was on 2026-11-19 when a page
   *  closed its own window. Counts and names only; never an address. Sent with `keepalive`, so a
   *  quitting browser's last word still arrives. */
  const diaryNote = (win, events) => {
    const s = server();
    if (!s) return;
    try {
      void win
        .fetch(`${s}/api/diary_note`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ events }),
          keepalive: true,
        })
        .catch(() => {});
    } catch (e) {
      /* no server: nothing to tell */
    }
  };
  const counts = () => {
    let windows = 0;
    let tabs = 0;
    for (const w of Services.wm.getEnumerator("navigator:browser")) {
      windows += 1;
      tabs += w.gBrowser?.tabs.length ?? 0;
    }
    return { windows, tabs };
  };
  let diaryStarted = false;
  Services.obs.addObserver((win) => {
    if (diaryStarted) return;
    diaryStarted = true;
    let ms = null;
    try {
      const i = Services.startup.getStartupInfo();
      ms = i.sessionRestored ? i.sessionRestored.getTime() - i.process.getTime() : null;
    } catch (e) {}
    diaryNote(win, [{ kind: "browser", what: "started", ...(ms === null ? {} : { ms }), ...counts() }]);
  }, "browser-delayed-startup-finished");
  Services.obs.addObserver((subject, topic, data) => {
    const win = Services.wm.getMostRecentWindow("navigator:browser");
    if (!win) return;
    const why = data === "lastwindow" ? "last-window-closed" : data === "restart" ? "restart" : "quit";
    diaryNote(win, [{ kind: "browser", what: why, ...counts() }]);
  }, "quit-application-requested");

  let antWatched = false;
  Services.obs.addObserver((win) => {
    try {
      makeSettings(win.CustomizableUI);
    } catch (e) {
      Components.utils.reportError(e);
    }
    try {
      makeFire(win.CustomizableUI);
    } catch (e) {
      Components.utils.reportError(`formicaria.cfg: 🔥: ${e}`);
    }
    // Once the first window is up, so Places is not woken while the browser is still starting.
    try {
      watchClosing();
    } catch (e) {
      Components.utils.reportError(`formicaria.cfg: forget when closing: ${e}`);
    }
    try {
      const CUI = win.CustomizableUI;
      // **The ant first in the tab row**, once: the person may move it afterwards.
      // **The ant is kept in the tab row** (the owner on 0.50: *"I don't see settings anymore"*): on
      // formicaria's pages the address row is hidden, so an ant anywhere else — in the address row,
      // or inside Firefox's Extensions menu, where an older placement left it — is out of reach,
      // and with it Settings, Privacy and updates. Placed once used to mean never again; and a
      // button inside the Extensions menu is only *created* when that menu opens, so the move
      // never happened there. Now: wherever it is, if not in the tab row, it goes to its start;
      // within the tab row it stays where the person put it.
      const placeAnt = () => {
        try {
          if (CUI.getPlacementOfWidget(ANT)?.area === CUI.AREA_TABSTRIP) return;
          CUI.addWidgetToArea(ANT, CUI.AREA_TABSTRIP, 0);
        } catch (e) {
          Components.utils.reportError(`formicaria.cfg: placing the ant: ${e}`);
        }
      };
      if (!antWatched) {
        antWatched = true;
        CUI.addListener({
          onWidgetCreated: (id) => id === ANT && placeAnt(),
          onWidgetAfterCreation: (id) => id === ANT && placeAnt(),
          onWidgetAdded: (id) => id === ANT && placeAnt(),
        });
        placeAnt();
        // The add-on starts after the window: asked again while it does.
        for (const ms of [2000, 6000, 15000]) win.setTimeout(placeAnt, ms);
        // The panel years' button and Firefox's sidebar and View buttons go, once; the person can
        // put the last two back from Customize Toolbar.
        if (!Services.prefs.getBoolPref("formicaria.toolbar.trimmed2", false)) {
          for (const id of ["formicaria-home", "sidebar-button", "firefox-view-button"]) {
            if (CUI.getPlacementOfWidget(id)) CUI.removeWidgetFromArea(id);
          }
          Services.prefs.setBoolPref("formicaria.toolbar.trimmed2", true);
        }
      }
    } catch (e) {
      Components.utils.reportError(e);
    }
    try {
      const doc = win.document;
      const keyset = doc.getElementById("mainKeyset");
      if (keyset && !doc.getElementById("key_formicaria_swap")) {
        const key = doc.createXULElement("key");
        key.id = "key_formicaria_swap";
        key.setAttribute("modifiers", "alt,shift");
        key.setAttribute("key", "X");
        key.setAttribute("oncommand", "void 0;");
        key.addEventListener("command", () => swap(win));
        keyset.append(key);
      }
      const gb = win.gBrowser;
      let shownTab = gb.selectedTab;
      gb.tabContainer.addEventListener("TabSelect", () => {
        if (shownTab && shownTab !== gb.selectedTab) win.formicariaPrevTab = new WeakRef(shownTab);
        shownTab = gb.selectedTab;
      });
      win.formicariaSwap = () => swap(win);
      watchBuild(win);
      watchPrivacy(win);
      keepToOurTabs(win);
      offerUpdate(win);
      // **+ suggests** (`decisions.md` 2026-11-17, *one frame*): a new tab is formicaria's new-tab page,
      // the features, a new note and a field for the web. A link opened in a new tab is Firefox's.
      try {
        const cmds = win.BrowserCommands;
        const firefoxOpenTab = cmds.openTab.bind(cmds);
        cmds.openTab = (args = {}) => {
          if (args?.url || !server()) return firefoxOpenTab(args);
          const t = gb.addTab(`${server()}/f/new`, { triggeringPrincipal: sys() });
          gb.selectedTab = t;
          return t;
        };
      } catch (e) {
        Components.utils.reportError(e);
      }
      // **← and → on formicaria's own pages** (the owner, 2026-11-25: *"If I am in home, select music
      // or any other view I cannot simply go back, as a user is used to"*). Firefox's ← and → live in
      // the address row, which goes on formicaria's pages, so they went with it and Back was left to
      // Alt+← and a mouse's side button. Two buttons at the start of the tab row bring them back,
      // shown only while a page of formicaria's is (`formicaria.css`; a web page has the address
      // row's own). They run Firefox's own commands, `Browser:Back` and `Browser:Forward`, so they
      // go where its ← and → would and are greyed when there is nowhere to go, as there. Outside
      // the row's customizable part: always first, never moved by placing the ant or Settings.
      try {
        makeBackForward(win);
      } catch (e) {
        Components.utils.reportError(`formicaria.cfg: ← and →: ${e}`);
      }
      // **☆ and Ctrl+D also make a bookmark note** (the owner, 2026-11-27: *"make ☆ save a bookmark
      // note"*). Firefox's bookmark stays, for Sync; the note is formicaria's, found by search and
      // Notes like every note. Its panel says so and opens it; Remove there takes both back.
      try {
        bookmarkNotes(win);
      } catch (e) {
        Components.utils.reportError(`formicaria.cfg: ☆: ${e}`);
      }
      // **One row on formicaria's own tabs**: the address row is for web pages, so it goes while a page
      // of formicaria's is shown (`formicaria.css`, `[formicaria-page]`).
      const mark = () => {
        const spec = gb.selectedBrowser?.currentURI?.spec ?? "";
        const s = server();
        const ours = !!s && spec.startsWith(`${s}/`);
        win.document.documentElement.toggleAttribute("formicaria-page", ours);
        // Firefox's own way to fold a toolbar away, which a style rule alone did not always reach.
        for (const id of ["nav-bar", "PersonalToolbar"]) {
          const bar = win.document.getElementById(id);
          if (bar && id === "nav-bar") bar.collapsed = ours;
        }
      };
      gb.tabContainer.addEventListener("TabSelect", mark);
      gb.addTabsProgressListener({
        onLocationChange(browser, progress) {
          if (progress?.isTopLevel && browser === gb.selectedBrowser) mark();
        },
      });
      mark();
      // For the release check: the carry-over of a tab from the panel years, by its function.
      win.formicariaCarryOver = (t) => carryOver(win, t);
      gb.tabContainer.addEventListener("SSTabRestoring", (e) => carryOver(win, e.target));
      for (const t of [...gb.tabs]) carryOver(win, t);
    } catch (e) {
      Components.utils.reportError(e);
    }
  }, "browser-delayed-startup-finished");

  // 5. Self-check, only when the release check asks (`ci/browser-check.sh`): what the person would see.
  const checkPath = Services.env.get("FM_BROWSER_CHECK");
  if (checkPath) {
    Services.obs.addObserver(function seen(win) {
      Services.obs.removeObserver(seen, "browser-delayed-startup-finished");
      setTimeout(() => {
        const report = { errors: [] };
        const step = (k, f) => {
          try {
            report[k] = f();
          } catch (e) {
            report.errors.push(`${k}: ${e}`);
          }
        };
        step("title", () => win.document.title);
        step("brand", () =>
          Services.strings
            .createBundle("chrome://branding/locale/brand.properties")
            .GetStringFromName("brandShortName"),
        );
        step("ant", () => win.CustomizableUI.getPlacementOfWidget(ANT)?.area ?? null);
        step("antFirst", () => win.CustomizableUI.getPlacementOfWidget(ANT)?.position === 0);
        step("home", () => home());
        step("signaturesLocked", () => Services.prefs.prefIsLocked("xpinstall.signatures.required"));
        step("strictApplied", () => Services.prefs.getStringPref("browser.contentblocking.category", ""));
        step("accountsAvailable", () => Services.prefs.getBoolPref("identity.fxaccounts.enabled", true));
        step("splitView", () => Services.prefs.getBoolPref("browser.tabs.splitView.enabled", false));
        step("tabsOnTop", () => !Services.prefs.getBoolPref("sidebar.verticalTabs", true) && !!win.document.getElementById("TabsToolbar")?.getBoundingClientRect().height);
        step("scrollSwitches", () => Services.prefs.getBoolPref("toolkit.tabbox.switchByScrolling", false));
        step("privacy", () => ({
          v: Services.prefs.getIntPref("formicaria.privacy.v", -1),
          clean: Services.prefs.getBoolPref("privacy.query_stripping.enabled", false),
          engine: searchService()?.defaultEngine?.name ?? null,
          addons: JSON.parse(Services.prefs.getStringPref("formicaria.privacy.addons", "[]")),
        }));
        step("sidebarButtonGone", () => !win.CustomizableUI.getPlacementOfWidget("sidebar-button"));
        // Settings at the right end of the tab row, drawn (`makeSettings`).
        step("settings", () => {
          const p = win.CustomizableUI.getPlacementOfWidget(SETTINGS);
          const node = win.document.getElementById(SETTINGS);
          const r = node?.getBoundingClientRect();
          const tabs = win.document.getElementById("tabbrowser-tabs")?.getBoundingClientRect();
          return {
            area: p?.area ?? null,
            drawn: !!r && r.width > 0 && r.height > 0,
            rightOfTabs: !!r && !!tabs && r.left >= tabs.left,
          };
        });
        step("policies", () => Object.keys(Services.policies.getActivePolicies() ?? {}).sort());
        step("sessionRestored_ms", () => {
          const i = Services.startup.getStartupInfo();
          return i.sessionRestored ? i.sessionRestored.getTime() - i.process.getTime() : null;
        });
        const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        f.initWithPath(checkPath);
        const s = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
        s.init(f, 0x02 | 0x08 | 0x20, 0o644, 0);
        // ASCII only: the stream below writes bytes, and a title carries an em dash.
        const t = JSON.stringify(report).replace(/[\u007f-\uffff]/g, (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
        s.write(t, t.length);
        s.close();
      }, 8000);
    }, "browser-delayed-startup-finished");
  }
  void g;
} catch (e) {
  Components.utils.reportError("formicaria.cfg: " + e);
}
