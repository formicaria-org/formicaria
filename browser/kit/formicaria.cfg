// formicaria's browser (this first line must be a comment) — `decisions.md` 2026-11-15 (evening).
//
// Run by Firefox at every start (`autoconfig.js` points here), with the browser's own privileges,
// before any window exists. **Kept small on purpose**: each hook below reaches into Firefox's window,
// which a new ESR major may move (one already did: CustomizableUI's module path), and
// `ci/browser-check.sh` exercises every one before a release. It never acts on anything a web page
// says: its only inputs are the person and formicaria's own address.
try {
  const g = Components.utils.getGlobalForObject(Services);
  const { setTimeout } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
  const kit = Services.dirsvc.get("GreD", Ci.nsIFile);
  kit.append("formicaria");

  // 1. Branding: formicaria's icons and older name strings over Firefox's (`chrome.manifest`). The
  //    modern name strings are swapped inside Firefox's package when the kit is applied.
  const manifest = kit.clone();
  manifest.append("chrome.manifest");
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);

  // 2. Defaults, not overrides (decision 4): the person's own changes in Firefox's settings win.
  //    The one locked line is what lets formicaria's own (unsigned) add-on install.
  lockPref("xpinstall.signatures.required", false);
  defaultPref("browser.contentblocking.category", "strict");
  defaultPref("dom.security.https_only_mode", true);
  defaultPref("privacy.globalprivacycontrol.enabled", true);
  defaultPref("cookiebanners.service.mode", 1);
  defaultPref("cookiebanners.service.mode.privateBrowsing", 1);
  defaultPref("browser.shell.checkDefaultBrowser", false);
  defaultPref("browser.aboutwelcome.enabled", false);
  defaultPref("sidebar.revamp", true);
  // **Tabs: classic, on top, always in view** (owner, 2026-11-16: *"why are we avoiding classic tabs
  // … ideally the number of icons is minimal and everything is intuitive"*). Down the side only when
  // the person chooses it in formicaria's Settings (`browser.json`, beside this browser), and then
  // always shown, never behind a button. Scrolling over the tabs switches them; Ctrl+Tab shows the
  // recent ones as cards.
  const settings = (() => {
    try {
      const f = Services.dirsvc.get("GreD", Ci.nsIFile).parent;
      f.append("browser.json");
      if (!f.exists()) return {};
      const raw = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
      raw.init(f, -1, 0, 0);
      const text = Cc["@mozilla.org/intl/converter-input-stream;1"].createInstance(Ci.nsIConverterInputStream);
      text.init(raw, "UTF-8", 0, 0);
      let all = "";
      const part = {};
      while (text.readString(0xffffffff, part) !== 0) all += part.value;
      text.close();
      return JSON.parse(all);
    } catch (e) {
      return {};
    }
  })();
  const sideTabs = settings.side_tabs === true;
  defaultPref("sidebar.verticalTabs", sideTabs);
  if (sideTabs) Services.prefs.setStringPref("sidebar.visibility", "always-show");
  defaultPref("toolkit.tabbox.switchByScrolling", true);
  defaultPref("browser.ctrlTab.sortByRecentlyUsed", true);
  defaultPref("browser.tabs.splitView.enabled", true);
  defaultPref("browser.tabs.unloadOnLowMemory", true);
  // Firefox's mascot and its "drag important tabs here" card above the tab list.
  defaultPref("sidebar.verticalTabs.dragToPinPromo.dismissed", true);

  // 3. formicaria's touches on the window.
  const sheet = kit.clone();
  sheet.append("formicaria.css");
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  sss.loadAndRegisterSheet(Services.io.newFileURI(sheet), sss.USER_SHEET);

  // 4. **formicaria docks beside the page** (`decisions.md` 2026-11-15, late night). One content
  //    browser at the right of the window's tab panels, the shape of Firefox's own right-hand panel,
  //    holds formicaria: one copy of the app, in one window at a time, never unloaded. Tabs are web
  //    pages only. Three looks: `beside` (resizable), `full` (formicaria fills the window, today's
  //    look) and `folded`. Its address is the browser's home page, which formicaria's policies set.
  const home = () => Services.prefs.getStringPref("browser.startup.homepage", "").split("|")[0];
  const ours = (spec) => {
    const h = home();
    return h.startsWith("http://127.0.0.1") && (spec ?? "").startsWith(h);
  };
  const STATE = "formicaria.panel.state";
  const WIDTH = "formicaria.panel.width";
  const SIDE = "formicaria.panel.side";
  const HEIGHT = "formicaria.panel.height";
  const sys = () => Services.scriptSecurityManager.getSystemPrincipal();
  const windows = () => [...Services.wm.getEnumerator("navigator:browser")];
  const panelOf = (win) => win.document.getElementById("formicaria-browser");
  const panelWindow = () => windows().find((w) => panelOf(w));

  const show = (win, state) => {
    const host = win.document.getElementById("browser");
    if (!host) return;
    host.setAttribute("formicaria", state);
    if (state !== "folded") Services.prefs.setStringPref(STATE, state);
  };
  // A page: anything but formicaria and an empty tab (a tab still loading counts as a page).
  const isPage = (t) => {
    const spec = t.linkedBrowser.currentURI.spec;
    return !t.closing && !ours(spec) && (spec !== "about:blank" || t.hasAttribute("busy"));
  };
  const webTabs = (win) => win.gBrowser.tabs.filter(isPage);

  const makePanel = (win) => {
    const doc = win.document;
    const host = doc.getElementById("browser");
    const tabbox = doc.getElementById("tabbrowser-tabbox");
    if (!host || !tabbox) return null;
    const splitter = doc.createXULElement("splitter");
    splitter.id = "formicaria-splitter";
    splitter.className = "sidebar-splitter";
    const order = String(Number(win.getComputedStyle(tabbox).order) || 0);
    const box = doc.createXULElement("vbox");
    box.id = "formicaria-panel";
    const w = Services.prefs.getIntPref(WIDTH, 0) || Math.round(win.innerWidth * 0.42);
    box.style.width = `${w}px`;
    const head = doc.createXULElement("hbox");
    head.id = "formicaria-panel-head";
    head.setAttribute("align", "center");
    const label = doc.createXULElement("label");
    label.setAttribute("value", "formicaria");
    label.setAttribute("flex", "1");
    const button = (id, text, tip, act) => {
      const b = doc.createXULElement("toolbarbutton");
      b.id = id;
      b.setAttribute("label", text);
      b.setAttribute("tooltiptext", tip);
      b.addEventListener("command", act);
      return b;
    };
    head.append(
      label,
      button("formicaria-panel-side", "\u21c6", "Move formicaria: right, below, left, above the page", () => {
        const order = ["right", "bottom", "left", "top"];
        const now = order.indexOf(Services.prefs.getStringPref(SIDE, "right"));
        place(win, order[(now + 1) % order.length]);
      }),
      button("formicaria-panel-size", "\u2922", "Fill the window, or go back beside the page", () =>
        show(win, host.getAttribute("formicaria") === "full" ? "beside" : "full"),
      ),
      button("formicaria-panel-fold", "\u2715", "Fold formicaria away (Alt+Shift+F brings it back)", () =>
        show(win, "folded"),
      ),
    );
    const b = doc.createXULElement("browser");
    for (const [k, v] of Object.entries({
      id: "formicaria-browser",
      type: "content",
      remote: "true",
      maychangeremoteness: "true",
      messagemanagergroup: "browsers",
      contextmenu: "contentAreaContextMenu",
      tooltip: "aHTMLTooltip",
      autocompletepopup: "PopupAutoComplete",
      flex: "1",
    })) {
      b.setAttribute(k, v);
    }
    box.append(head, b);
    tabbox.after(splitter, box);
    splitter.style.order = order;
    box.style.order = order;
    // Double-click the divider: fill the window, or back beside the page.
    splitter.addEventListener("dblclick", () =>
      show(win, host.getAttribute("formicaria") === "full" ? "beside" : "full"),
    );
    place(win, Services.prefs.getStringPref(SIDE, "right"));
    // The width the person gives it is kept for next time.
    new win.ResizeObserver(() => {
      if (host.getAttribute("formicaria") !== "beside") return;
      const across = /^(top|bottom)$/.test(host.getAttribute("formicaria-side") ?? "");
      if (across && box.clientHeight > 80) Services.prefs.setIntPref(HEIGHT, box.clientHeight);
      if (!across && box.clientWidth > 120) Services.prefs.setIntPref(WIDTH, box.clientWidth);
    }).observe(box);
    return b;
  };

  // **Left or right of the page, as the person chooses** (research §11.6): the same row, the panel
  // and its divider on one side of the tab panels or the other. They share the tab panels' CSS
  // `order`, so their place in the row is their place in the document; the tab panels never move
  // (moving them would reload every page).
  const place = (win, side) => {
    const doc = win.document;
    const tabbox = doc.getElementById("tabbrowser-tabbox");
    const box = doc.getElementById("formicaria-panel");
    const splitter = doc.getElementById("formicaria-splitter");
    if (!tabbox || !box || !splitter) return;
    // A browser moved in the document starts again empty: formicaria is loaded back where it was.
    const b = panelOf(win);
    const was = b?.currentURI?.spec;
    if (side === "left") {
      tabbox.before(box, splitter);
      splitter.setAttribute("resizebefore", "sibling");
      splitter.setAttribute("resizeafter", "none");
    } else if (side === "top" || side === "bottom") {
      // Above or below the pages: inside the page area's own box, which stacks its children, so
      // the divider resizes heights. The pages (`tabpanels`) are never moved.
      const pages = doc.getElementById("tabbrowser-tabpanels");
      if (side === "top") {
        pages.before(box, splitter);
        splitter.setAttribute("resizebefore", "sibling");
        splitter.setAttribute("resizeafter", "none");
      } else {
        pages.after(splitter, box);
        splitter.setAttribute("resizebefore", "none");
        splitter.setAttribute("resizeafter", "sibling");
      }
    } else {
      tabbox.after(splitter, box);
      splitter.setAttribute("resizebefore", "none");
      splitter.setAttribute("resizeafter", "sibling");
    }
    // Beside the pages it has a width; above or below them, a height. Inside the page area its place
    // is its place in the document (no CSS order).
    const across = side === "top" || side === "bottom";
    const order = String(Number(win.getComputedStyle(tabbox).order) || 0);
    box.style.order = splitter.style.order = across ? "" : order;
    if (across) {
      box.style.width = "";
      box.style.height = `${Services.prefs.getIntPref(HEIGHT, 0) || Math.round(win.innerHeight * 0.4)}px`;
    } else {
      box.style.height = "";
      box.style.width = `${Services.prefs.getIntPref(WIDTH, 0) || Math.round(win.innerWidth * 0.42)}px`;
    }
    doc.getElementById("browser")?.setAttribute("formicaria-side", side);
    Services.prefs.setStringPref(SIDE, side);
    if (b && was && ours(was)) {
      setTimeout(() => {
        if (b.currentURI?.spec !== was) b.fixupAndLoadURIString(was, { triggeringPrincipal: sys() });
      }, 0);
    }
  };

  // Show formicaria in `win` (moving it there is not done: it lives in one window; another window's
  // request brings that one forward). `spec` is formicaria's address to open, a note's included.
  const reveal = (win, spec) => {
    const pw = panelWindow();
    if (pw && pw !== win) {
      pw.focus();
      win = pw;
    }
    let b = panelOf(win) ?? makePanel(win);
    if (!b) return;
    const current = b.currentURI?.spec ?? "about:blank";
    if (spec && spec !== current && !(current !== "about:blank" && spec === home())) {
      b.fixupAndLoadURIString(spec, { triggeringPrincipal: sys() });
    } else if (current === "about:blank") {
      b.fixupAndLoadURIString(home(), { triggeringPrincipal: sys() });
    }
    const was = win.document.getElementById("browser")?.getAttribute("formicaria");
    if (!was || was === "folded") {
      show(win, webTabs(win).length ? "beside" : "full");
    }
  };
  const toggle = (win) => {
    const pw = panelWindow();
    const host = (pw ?? win).document.getElementById("browser");
    if (pw && host.getAttribute("formicaria") !== "folded") {
      if (pw === win) show(win, "folded");
      else pw.focus();
    } else {
      reveal(win, null);
    }
  };

  let widgetMade = false;
  Services.obs.addObserver((win) => {
    // The ant button and Alt+Shift+F show formicaria, or fold it away.
    if (!widgetMade) {
      widgetMade = true;
      try {
        const CUI = win.CustomizableUI;
        CUI.createWidget({
          id: "formicaria-home",
          label: "formicaria",
          tooltiptext: "formicaria (Alt+Shift+F)",
          onCommand: (e) => toggle(e.target.ownerGlobal),
        });
        if (!CUI.getPlacementOfWidget("formicaria-home")) {
          CUI.addWidgetToArea("formicaria-home", CUI.AREA_NAVBAR, 0);
        }
        // **Few icons** (owner, 2026-11-16): the sidebar's button and Firefox View's go, once; the
        // person can put them back from Customize Toolbar.
        if (!Services.prefs.getBoolPref("formicaria.toolbar.trimmed", false)) {
          for (const id of ["sidebar-button", "firefox-view-button"]) {
            if (CUI.getPlacementOfWidget(id)) CUI.removeWidgetFromArea(id);
          }
          Services.prefs.setBoolPref("formicaria.toolbar.trimmed", true);
        }
      } catch (e) {
        Components.utils.reportError(e);
      }
    }
    try {
      const doc = win.document;
      const keyset = doc.getElementById("mainKeyset");
      if (keyset && !doc.getElementById("key_formicaria")) {
        const key = doc.createXULElement("key");
        key.id = "key_formicaria";
        key.setAttribute("modifiers", "alt,shift");
        key.setAttribute("key", "F");
        key.setAttribute("oncommand", "void 0;");
        key.addEventListener("command", () => toggle(win));
        keyset.append(key);
      }
    } catch (e) {
      Components.utils.reportError(e);
    }
    // **No tab holds formicaria.** A tab that loads formicaria's address (the launcher, a
    // double-click, the home button, a session restored from 0.33's pinned tab) hands the address
    // to the panel and goes away; a window left with no other tab keeps an empty one.
    try {
      const gb = win.gBrowser;
      gb.addTabsProgressListener({
        onLocationChange(browser, progress, _request, location) {
          if (!progress?.isTopLevel) return;
          if (!ours(location?.spec)) {
            // A page arriving in the tab shown while formicaria fills the window: side by side.
            const host = win.document.getElementById("browser");
            if (browser === gb.selectedBrowser && /^(https?|file):/.test(location?.spec ?? "") && host?.getAttribute("formicaria") === "full") {
              show(win, "beside");
            }
            return;
          }
          const tab = gb.getTabForBrowser(browser);
          if (!tab) return;
          const spec = location.spec;
          setTimeout(() => {
            reveal(win, spec);
            if (tab.closing) return;
            if (tab.pinned) gb.unpinTab(tab);
            if (gb.tabs.length > 1) gb.removeTab(tab);
            else browser.fixupAndLoadURIString("about:blank", { triggeringPrincipal: sys() });
          }, 0);
        },
      });
      // Choosing a page while formicaria fills the window puts it beside the page.
      gb.tabContainer.addEventListener("TabSelect", () => {
        const host = win.document.getElementById("browser");
        if (host?.getAttribute("formicaria") === "full" && webTabs(win).includes(gb.selectedTab)) {
          show(win, "beside");
        }
      });
    } catch (e) {
      Components.utils.reportError(e);
    }
  }, "browser-delayed-startup-finished");

  // 5. Self-check, only when the release check asks (`ci/browser-check.sh`): what the person would see.
  const checkPath = Services.env.get("FM_BROWSER_CHECK");
  if (checkPath) {
    Services.obs.addObserver(function seen(win) {
      Services.obs.removeObserver(seen, "browser-delayed-startup-finished");
      setTimeout(() => {
        const report = { errors: [] };
        const step = (k, f) => {
          try {
            report[k] = f();
          } catch (e) {
            report.errors.push(`${k}: ${e}`);
          }
        };
        step("title", () => win.document.title);
        step("brand", () =>
          Services.strings
            .createBundle("chrome://branding/locale/brand.properties")
            .GetStringFromName("brandShortName"),
        );
        step("widget", () => !!win.document.getElementById("formicaria-home"));
        step("panel", () => ours(panelOf(win)?.currentURI?.spec));
        step("panelState", () => win.document.getElementById("browser")?.getAttribute("formicaria"));
        step("formicariaTabs", () => win.gBrowser.tabs.filter((t) => ours(t.linkedBrowser.currentURI.spec)).length);
        step("partitionKey", () => panelOf(win)?.browsingContext?.currentWindowGlobal?.documentPrincipal?.originAttributes?.partitionKey ?? "none");
        step("signaturesLocked", () => Services.prefs.prefIsLocked("xpinstall.signatures.required"));
        step("strictIsDefaultOnly", () => !Services.prefs.prefHasUserValue("browser.contentblocking.category"));
        step("accountsAvailable", () => Services.prefs.getBoolPref("identity.fxaccounts.enabled", true));
        step("splitView", () => Services.prefs.getBoolPref("browser.tabs.splitView.enabled", false));
        step("tabsOnTop", () => !Services.prefs.getBoolPref("sidebar.verticalTabs", true) && !!win.document.getElementById("TabsToolbar")?.getBoundingClientRect().height);
        step("scrollSwitches", () => Services.prefs.getBoolPref("toolkit.tabbox.switchByScrolling", false));
        step("sidebarButtonGone", () => !win.CustomizableUI.getPlacementOfWidget("sidebar-button"));
        step("policies", () => Object.keys(Services.policies.getActivePolicies() ?? {}).sort());
        step("sessionRestored_ms", () => {
          const i = Services.startup.getStartupInfo();
          return i.sessionRestored ? i.sessionRestored.getTime() - i.process.getTime() : null;
        });
        const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        f.initWithPath(checkPath);
        const s = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
        s.init(f, 0x02 | 0x08 | 0x20, 0o644, 0);
        // ASCII only: the stream below writes bytes, and a title carries an em dash.
        const t = JSON.stringify(report).replace(/[\u007f-\uffff]/g, (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
        s.write(t, t.length);
        s.close();
      }, 8000);
    }, "browser-delayed-startup-finished");
  }
  void g;
} catch (e) {
  Components.utils.reportError("formicaria.cfg: " + e);
}
