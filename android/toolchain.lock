# The Android toolchain, pinned by our own SHA-256.
#
# Why this file exists: the NDK/SDK/platform-tools have no conda packaging, so they cannot be
# pinned by `pixi.lock`. They are still not allowed to become *system* requirements — a
# dependency installed with `sudo` is one this repo can neither pin nor remove. Every artifact
# Google ships is a standalone zip rather than an installer, so `pixi run android-init` unpacks
# them into a gitignored `.android/` in this tree and verifies each against the checksum below.
#
# The checksum, not the URL, is the assertion. Google may re-point a URL; a mismatch fails the
# bootstrap loudly rather than silently installing a different toolchain. Reproducibility for
# this project is `pixi.lock` PLUS this file — neither alone.
#
# Format, one artifact per line, whitespace-separated:
#   <name>  <version>  <os>  <sha256>  <url>
#
# <name> is also the directory the zip unpacks to inside `.android/`.
# <os> is `linux`, `macos`, or `any`; lines for other systems are skipped.
#
# To add or bump an entry: download the artifact, `sha256sum` it, and paste the result here.
# Never paste a checksum you did not compute from the bytes you actually fetched.

platform-tools 37.0.0 linux 198ae156ab285fa555987219af237b31102fefe8b9d2bc274708a8d4f2865a07 https://dl.google.com/android/repository/platform-tools_r37.0.0-linux.zip

# The NDK: the C cross-compiler, sysroot and linker. Needed by `rusqlite bundled` and by
# `git2/vendored-libgit2` — neither is optional, so nothing in `fm-core` builds for Android
# without this.
#
# **r27 is the LTS line.** r28+ aligns to 16 KB pages by default, which r27 needs an explicit
# `-Wl,-z,max-page-size=16384` for (see `.cargo/config.toml`) — that flag is the price of
# staying on LTS, and it is cheap and written down. Bump to r28 when the LTS line moves.
#
# The unpack directory is version-named because that is what the zip contains, so two versions
# can coexist and a bump never merges into a half-old tree. `.cargo/config.toml` names the same
# version, and `ci/checks.sh` fails if the two ever disagree.
android-ndk-r27d 27.3 linux 601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9 https://dl.google.com/android/repository/android-ndk-r27d-linux.zip

# cmdline-tools: `sdkmanager`, which is how the emulator, system images, build-tools and the
# platform jars are fetched. Those are NOT pinned here — sdkmanager resolves them against
# Google's own manifest at run time, which is exactly why the `android-apk` side is declared
# **non-hermetic** in `docs/context/decisions.md`. This zip is pinned; what it downloads is not.
# That is an honest boundary, not an oversight: pinning the whole SDK would mean mirroring it.
