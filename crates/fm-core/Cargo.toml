[package]
name = "fm-core"
edition.workspace = true
version.workspace = true
license.workspace = true

# fm-core is the I/O crate: it MAY depend on rusqlite/std::fs (fm-query may not).
# rusqlite `bundled` compiles SQLite (incl. FTS5) into the binary — no cgo, no
# runtime dependency.
[dependencies]
fm-model = { workspace = true }
fm-query = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
time = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.11"      # sha256 content addressing — verifiable with `sha256sum` forever
infer = "0.19"     # pure-Rust MIME sniff by magic bytes (never trust the extension)

[dev-dependencies]
tempfile = "3"
time = { workspace = true }   # macros (datetime!) for search recency-ordering tests
