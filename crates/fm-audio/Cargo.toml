[package]
name = "fm-audio"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Sound as MP3, and tags written, for Save media on the phone: in place of a 35 MB ffmpeg (decisions.md 2026-11-17, structure and size)."

[dependencies]
# Decoding the sound sites serve (AAC in MP4, MP3, WAV). MPL-2.0, pure Rust.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "pcm", "ogg", "vorbis", "flac"] }
# LAME, the MP3 encoder, built from its C source. LGPL: linked into the phone app only, which is
# distributed under GPL-3.0 (README); the computer builds do not link this crate.
mp3lame-encoder = "0.3"
# The tags and the cover, written into the finished file before it is stored.
lofty = "0.25"

[dev-dependencies]
tempfile = "3"
