[package]
name = "fm-app"
edition.workspace = true
version.workspace = true
license.workspace = true

# The command library: serializable DTOs, board/agenda/gallery/timeline grouping,
# search, property write-back, and asset resolution over the `Store` seam — all
# webkit-free and unit-tested. It has no binary of its own; the browser server
# (`fm-serve`) fronts these functions over HTTP. (The native Tauri window was
# retired — the browser is the product.)
[lib]
name = "fm_app"
path = "src/lib.rs"

# **So the phone's git backend is reachable from a dispatch-level test.**
#
# `vcs.rs` warns that on any machine with a `git` binary every routed call resolves to the
# subprocess backend, "which makes the phone's real code path unreachable from any test that drives
# the app commands" — the blind spot that let the proposal lifecycle ship desktop-only. `fm-cli` had
# a passthrough for exactly this; `fm-app`, where `dispatch` lives, did not, so no test of a
# *command* could select libgit2. This adds it. Off by default: the desktop links no libgit2.
[features]
native-git = ["fm-core/native-git"]

[dependencies]
fm-model = { workspace = true }
fm-query = { workspace = true }
fm-core = { workspace = true }
ulid = { workspace = true }         # mint a fresh id for a cross-vault copy (a copy is a new note)
serde = { workspace = true }
serde_json = "1"
serde_yaml_ng = { workspace = true }   # `.view` files are YAML — same parser as note frontmatter
time = { workspace = true }

[dev-dependencies]
fm-core = { workspace = true }
tempfile = "3"
