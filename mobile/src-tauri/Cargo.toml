# The Android shell. Thin by construction: it owns the window, the platform seam, and nothing
# else — every command it answers goes straight to `fm_app::dispatch`, the same door `fm-serve`
# uses. That is ruling 1 of the mobile design, and the reason a second frontend costs a file
# rather than a fork.
#
# Outside the workspace on purpose (see the root Cargo.toml).
[package]
name = "formicaria-mobile"
version = "0.0.0"
edition = "2021"
license = "MIT"

# `cdylib` is what Android loads; `staticlib` is iOS; `rlib` keeps it usable from a desktop
# binary for debugging. Tauri's mobile entry point needs the library shape, not a bin.
[lib]
name = "formicaria_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The in-process study agent is ALL behind this feature — on by default, so the shipped APK has it,
# but `cargo build --no-default-features` compiles a provably agent-free notebook: `fm-agent` and
# `fm-agent-run` are `optional`, so with the feature off they are not in the graph at all. This is
# the mobile mirror of `fm-serve`'s `agent` feature — "rm -rf the agent and a notes-only build is
# byte-identical" becomes compiler-enforced, so a notes-only user pays nothing for the agent.
# Enforced structurally by ci/checks.sh (no Android toolchain in `pixi run ci`).
#
# **The code reads `agent_shell`, not this feature.** A Cargo feature cannot be conditioned on a
# target, and `default = ["agent"]` turns this on for iOS too — where `src/agent.rs` cannot compile
# (its model runner needs an APK's `nativeLibraryDir`) and where the ruling is that it should not.
# `build.rs` ANDs this feature with Android and emits `agent_shell`; see it for the whole argument.
[features]
default = ["agent"]
# `fm-agent-run/download` gives the phone the in-app model fetcher (resumable + checksum) — no `curl`
# on Android, so the GGUF is fetched on first enable from Rust.
agent = ["dep:fm-agent", "dep:fm-agent-run", "fm-agent-run/download"]

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# The whole point: one command surface, reused. `native-git` because a phone has no `git`
# binary to shell out to — verified on a real device.
fm-app = { path = "../../crates/fm-app" }
fm-core = { path = "../../crates/fm-core", features = ["native-git"] }
# The study agent, run IN-PROCESS on the phone: the same runner as the desktop, but its VaultAccess
# calls fm_app::dispatch directly (no localhost fm-serve, which Android has none of). Optional +
# behind the `agent` feature above, so a notes-only build links neither.
fm-agent = { path = "../../crates/fm-agent", optional = true }
fm-agent-run = { path = "../../crates/fm-agent-run", optional = true }

# **So a diagnostic is readable.** Android routes neither Rust's stdout nor its stderr to
# logcat, so every `eprintln!` in this shell has been writing to nowhere — which is how an SSL
# failure stayed unexplained across several builds while the app was, in fact, saying why. These
# put the same lines somewhere `adb logcat -s formicaria` can see them.
#
# `log` is unconditional; only the *backend* is per-platform. iOS needs no crate at all — its sink
# is stderr, which `simctl launch --console-pty` prints — so nothing is added here for it. See
# `install_logger` for why not `os_log`.
log = "0.4"
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
